<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Admin | TecniRed</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <style>
      :root {
        --primary: #4a8df5;
        --secondary: #00c6ff;
        --dark: #0b1629;
        --light: #cbd5e1;
        --white: #fff;
        --warning: #ff9800;
        --danger: #f44336;
      }

      * {
        box-sizing: border-box;
        font-family: "Poppins", sans-serif;
      }
      body {
        margin: 0;
        background: var(--dark);
        color: var(--white);
        overflow-x: hidden;
      }

      #particles-bg {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: -1;
        background: linear-gradient(135deg, #0b1629, #0f1e35);
      }

      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 20px 8%;
        background: rgba(11, 22, 41, 0.85);
        backdrop-filter: blur(12px);
        border-bottom: 1px solid rgba(0, 198, 255, 0.15);
        margin-bottom: 30px;
      }
      header h2 {
        font-size: 24px;
        background: linear-gradient(90deg, var(--primary), var(--secondary));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .logout-btn {
        background: var(--danger);
        color: var(--white);
        border: none;
        padding: 10px 18px;
        border-radius: 8px;
        cursor: pointer;
        font-weight: 600;
        transition: 0.3s;
      }
      .logout-btn:hover {
        background: #e53935;
      }

      .filter-container {
        text-align: center;
        margin-bottom: 20px;
      }
      .filter-container input,
      .filter-container button {
        padding: 10px 15px;
        border-radius: 8px;
        border: none;
        margin-right: 10px;
        font-weight: 600;
      }
      .filter-container input {
        width: 220px;
        border: 1px solid #444;
        background: rgba(255, 255, 255, 0.1);
        color: var(--white);
      }
      .filter-container button {
        background: var(--primary);
        color: var(--white);
        cursor: pointer;
        transition: 0.3s;
      }
      .filter-container button:hover {
        background: var(--secondary);
      }

      table {
        width: 95%;
        margin: auto;
        border-collapse: collapse;
        background: rgba(255, 255, 255, 0.05);
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 10px 25px rgba(0, 198, 255, 0.1);
        transition: 0.3s;
      }
      thead {
        background: rgba(0, 198, 255, 0.2);
      }
      th,
      td {
        padding: 12px;
        text-align: center;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      }
      tr:nth-child(even) {
        background: rgba(255, 255, 255, 0.05);
      }
      table tr:hover {
        transform: translateY(-2px);
        background: rgba(0, 198, 255, 0.1);
        transition: 0.3s;
      }

      select {
        padding: 6px 10px;
        border-radius: 6px;
        border: 1px solid #444;
        cursor: pointer;
        background: rgba(0, 0, 0, 0.5);
        color: var(--white);
      }
      select:focus {
        outline: none;
        border-color: var(--primary);
      }

      .alert-warning {
        background-color: var(--warning);
        color: var(--white);
        border-radius: 6px;
        padding: 4px 8px;
      }
      .alert-danger {
        background-color: var(--danger);
        color: var(--white);
        border-radius: 6px;
        padding: 4px 8px;
      }
    </style>
  </head>
  <body>
    <div id="particles-bg"></div>

    <header>
      <h2>Admin - Panel TecniRed</h2>
      <button class="logout-btn" onclick="cerrarSesion()">Cerrar sesión</button>
    </header>

    <div class="filter-container">
      <input
        type="text"
        id="filtro"
        placeholder="Filtra por ID o texto del ticket..."
      />
      <button onclick="filtrarTickets()">Filtrar</button>
      <button onclick="mostrarTodos()">Mostrar todos</button>
    </div>

    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Nombre</th>
          <th>Email</th>
          <th>Teléfono</th>
          <th>Categoría</th>
          <th>Descripción</th>
          <th>Estado</th>
          <th>Acción</th>
          <th>Escalar</th>
          <th>Fecha</th>
          <th>Alerta</th>
        </tr>
      </thead>
      <tbody id="tablaTickets"></tbody>
    </table>

    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <script>
      particlesJS("particles-bg", {
        particles: {
          number: { value: 50 },
          color: { value: "#00c6ff" },
          shape: { type: "circle" },
          opacity: { value: 0.5 },
          size: { value: 3 },
          line_linked: {
            enable: true,
            distance: 120,
            color: "#00c6ff",
            opacity: 0.3,
            width: 1,
          },
          move: { enable: true, speed: 2 },
        },
      });

      const usuario = JSON.parse(localStorage.getItem("usuario"));
      if (!usuario || usuario.rol !== "admin") window.location.href = "/";

      let ticketsCache = [];

      async function cargarTickets() {
        const res = await fetch("/tickets");
        const tickets = await res.json();
        ticketsCache = tickets;
        pintarTickets(tickets);
      }

      function pintarTickets(tickets) {
        const tbody = document.getElementById("tablaTickets");
        tbody.innerHTML = "";

        tickets.forEach((t) => {
          let alerta = "";
          if (t.fecha) {
            const fechaTicket = new Date(t.fecha);
            const ahora = new Date();
            const diasTranscurridos = Math.floor(
              (ahora - fechaTicket) / (1000 * 60 * 60 * 24),
            );
            if (diasTranscurridos >= 2)
              alerta = '<span class="alert-danger">Último día</span>';
            else if (diasTranscurridos >= 1)
              alerta = '<span class="alert-warning">Falta 1-2 días</span>';
          }

          tbody.innerHTML += `
<tr>
  <td>${t.id}</td>
  <td>${t.nombre}</td>
  <td>${t.email}</td>
  <td>${t.telefono || "No registrado"}</td>
  <td>${t.categoria}</td>
  <td style="max-width:300px; text-align:left;">${t.descripcion}</td>
  <td>${t.estado}</td>
  <td>
    <select onchange="cambiarEstado(${t.id}, this.value)">
      <option ${t.estado === "Nuevo" ? "selected" : ""}>Nuevo</option>
      <option ${t.estado === "Proceso" ? "selected" : ""}>Proceso</option>
      <option ${t.estado === "Finalizado" ? "selected" : ""}>Finalizado</option>
    </select>
  </td>
  <td>
    <select onchange="cambiarEscala(${t.id}, this.value)">
      <option ${!t.escala || t.escala === "Seleccionar" ? "selected" : ""}>Seleccionar</option>
      <option value="1" ${t.escala === "1" ? "selected" : ""}>1</option>
      <option value="2" ${t.escala === "2" ? "selected" : ""}>2</option>
      <option value="3" ${t.escala === "3" ? "selected" : ""}>3</option>
    </select>
  </td>
  <td>${formatearFecha(t.fecha)}</td>
  <td>${alerta}</td>
</tr>`;
        });
      }

      function filtrarTickets() {
        const filtro = document.getElementById("filtro").value.toLowerCase();
        const filtrados = ticketsCache.filter(
          (t) =>
            t.id.toString() === filtro ||
            t.descripcion.toLowerCase().includes(filtro),
        );
        pintarTickets(filtrados);
      }

      function mostrarTodos() {
        pintarTickets(ticketsCache);
      }

      // 🔥 CORREGIDO - YA NO RECARGA TODO
      async function cambiarEstado(id, estado) {
        const res = await fetch(`/tickets/${id}`, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ estado }),
        });

        if (res.ok) {
          ticketsCache = ticketsCache.map((t) =>
            t.id === id ? { ...t, estado } : t,
          );
        }
      }

      // 🔥 CORREGIDO - YA NO RECARGA TODO
      async function cambiarEscala(id, escala) {
        if (escala === "Seleccionar") return;

        const res = await fetch(`/tickets/escalar/${id}`, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ escala }),
        });

        if (res.ok) {
          ticketsCache = ticketsCache.map((t) =>
            t.id === id ? { ...t, escala } : t,
          );
        }
      }

      function formatearFecha(fechaISO) {
        if (!fechaISO) return "";
        const fecha = new Date(fechaISO);
        return fecha.toLocaleString("es-CO", {
          year: "numeric",
          month: "2-digit",
          day: "2-digit",
          hour: "2-digit",
          minute: "2-digit",
        });
      }

      function cerrarSesion() {
        localStorage.removeItem("usuario");
        window.location.href = "/";
      }

      document.addEventListener("DOMContentLoaded", cargarTickets);
    </script>
  </body>
</html>
