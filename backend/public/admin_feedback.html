<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feedback de Clientes - TecniRed</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    :root {
      --primary: #38bdf8; --primary-soft: #0ea5e9; --accent: #6366f1;
      --dark: #020617; --light: #f1f5f9; --muted: #94a3b8;
      --card-bg: rgba(15,23,42,0.7); --border: rgba(56,189,248,0.15);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: "Inter", sans-serif; }
    body {
      background: var(--dark);
      color: var(--light);
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
    }
    
    /* Canvas de fondo */
    #bg-canvas {
      position: fixed;
      inset: 0;
      z-index: 0;
    }
    
    .container {
      position: relative;
      z-index: 1;
      max-width: 1400px;
      margin: 0 auto;
      padding: 20px;
    }
    
    .back-button {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--light);
      padding: 12px 25px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 600;
      margin-bottom: 30px;
      transition: all 0.3s ease;
      backdrop-filter: blur(20px);
    }
    .back-button:hover {
      border-color: var(--primary);
      transform: translateX(-5px);
      box-shadow: 0 8px 20px rgba(56,189,248,0.2);
    }
    
    .header {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 40px;
      margin-bottom: 30px;
      backdrop-filter: blur(20px);
      box-shadow: 0 10px 40px rgba(0,0,0,0.3);
    }
    h1 {
      color: var(--light);
      font-size: 2.2rem;
      margin-bottom: 10px;
      font-weight: 800;
    }
    .subtitle {
      color: var(--muted);
      font-size: 1.05rem;
    }
    
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }
    .stat-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 28px;
      text-align: center;
      backdrop-filter: blur(20px);
      transition: all 0.3s ease;
    }
    .stat-card:hover {
      transform: translateY(-5px);
      border-color: var(--primary);
      box-shadow: 0 10px 30px rgba(56,189,248,0.2);
    }
    .stat-icon {
      font-size: 2.5rem;
      margin-bottom: 15px;
    }
    .stat-value {
      font-size: 2.2rem;
      font-weight: 900;
      color: var(--primary);
      margin-bottom: 8px;
    }
    .stat-label {
      color: var(--muted);
      font-size: 0.9rem;
      font-weight: 500;
    }
    
    .filters {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 30px;
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      align-items: center;
      backdrop-filter: blur(20px);
    }
    .filters label {
      font-weight: 600;
      color: var(--light);
      font-size: 0.9rem;
    }
    .filters select {
      padding: 10px 16px;
      background: rgba(255,255,255,0.06);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--light);
      font-size: 0.95rem;
      outline: none;
      cursor: pointer;
      transition: all 0.2s;
    }
    .filters select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(56,189,248,0.1);
    }
    .filters select option {
      background: #0f172a;
    }
    
    .feedback-list {
      display: grid;
      gap: 20px;
    }
    .feedback-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 28px;
      backdrop-filter: blur(20px);
      transition: all 0.3s ease;
    }
    .feedback-card:hover {
      transform: translateY(-5px);
      border-color: var(--primary);
      box-shadow: 0 10px 30px rgba(56,189,248,0.15);
    }
    .feedback-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 18px;
      flex-wrap: wrap;
      gap: 15px;
    }
    .feedback-user {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .user-avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--primary-soft), var(--primary));
      display: flex;
      align-items: center;
      justify-content: center;
      color: #06202c;
      font-weight: 800;
      font-size: 1.3rem;
      flex-shrink: 0;
    }
    .user-info h3 {
      font-size: 1.05rem;
      color: var(--light);
      margin-bottom: 4px;
      font-weight: 700;
    }
    .user-info p {
      font-size: 0.88rem;
      color: var(--muted);
    }
    .feedback-meta {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }
    .badge {
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.82rem;
      font-weight: 700;
      border: 1px solid;
    }
    .badge-comentario {
      background: rgba(56,189,248,0.15);
      color: var(--primary);
      border-color: rgba(56,189,248,0.3);
    }
    .badge-sugerencia {
      background: rgba(245,158,11,0.15);
      color: #f59e0b;
      border-color: rgba(245,158,11,0.3);
    }
    .badge-problema {
      background: rgba(239,68,68,0.15);
      color: #ef4444;
      border-color: rgba(239,68,68,0.3);
    }
    .badge-felicitacion {
      background: rgba(34,197,94,0.15);
      color: #22c55e;
      border-color: rgba(34,197,94,0.3);
    }
    .rating {
      display: flex;
      gap: 4px;
      font-size: 1.1rem;
    }
    .star-filled {
      color: #fbbf24;
    }
    .star-empty {
      color: rgba(255,255,255,0.2);
    }
    .feedback-message {
      color: var(--light);
      line-height: 1.7;
      margin-bottom: 15px;
      font-size: 0.98rem;
    }
    .feedback-date {
      color: var(--muted);
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .loading {
      text-align: center;
      color: var(--muted);
      font-size: 1.2rem;
      padding: 60px;
    }
    
    @media (max-width: 768px) {
      .stats-grid {
        grid-template-columns: 1fr 1fr;
      }
      .filters {
        flex-direction: column;
        align-items: stretch;
      }
      .filters select {
        width: 100%;
      }
      h1 {
        font-size: 1.8rem;
      }
    }
  </style>
</head>
<body>
  <canvas id="bg-canvas"></canvas>
  
  <div class="container">
    <a href="/admin.html" class="back-button">
      <i class="fa-solid fa-arrow-left"></i>
      Volver al Panel Admin
    </a>

    <div class="header">
      <h1>📊 Feedback de Clientes</h1>
      <p class="subtitle">Comentarios, sugerencias y calificaciones recibidas</p>
    </div>

    <div class="stats-grid" id="statsContainer">
      <div class="stat-card">
        <div class="stat-icon">📝</div>
        <div class="stat-value" id="statTotal">0</div>
        <div class="stat-label">Total Feedback</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon">⭐</div>
        <div class="stat-value" id="statPromedio">0.0</div>
        <div class="stat-label">Calificación Promedio</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon">😊</div>
        <div class="stat-value" id="statPositivos">0</div>
        <div class="stat-label">Feedback Positivo</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon">😞</div>
        <div class="stat-value" id="statNegativos">0</div>
        <div class="stat-label">Feedback Negativo</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon">👥</div>
        <div class="stat-value" id="statUsuarios">0</div>
        <div class="stat-label">Usuarios Únicos</div>
      </div>
    </div>

    <div class="filters">
      <label>Filtrar por tipo:</label>
      <select id="filterTipo" onchange="cargarFeedback()">
        <option value="">Todos</option>
        <option value="comentario">💬 Comentarios</option>
        <option value="sugerencia">💡 Sugerencias</option>
        <option value="problema">⚠️ Problemas</option>
        <option value="felicitacion">🎉 Felicitaciones</option>
      </select>

      <label>Filtrar por calificación:</label>
      <select id="filterRating" onchange="cargarFeedback()">
        <option value="">Todas</option>
        <option value="5">⭐⭐⭐⭐⭐ (5 estrellas)</option>
        <option value="4">⭐⭐⭐⭐ (4 estrellas)</option>
        <option value="3">⭐⭐⭐ (3 estrellas)</option>
        <option value="2">⭐⭐ (2 estrellas)</option>
        <option value="1">⭐ (1 estrella)</option>
      </select>

      <label>Mostrar:</label>
      <select id="filterLimit" onchange="cargarFeedback()">
        <option value="50">50 más recientes</option>
        <option value="100">100 más recientes</option>
        <option value="">Todos</option>
      </select>
    </div>

    <div class="feedback-list" id="feedbackList">
      <div class="loading">Cargando feedback...</div>
    </div>
  </div>

  <script>
    async function cargarEstadisticas() {
      try {
        const res = await fetch("/feedback/stats");
        const data = await res.json();

        if (data.status === "ok") {
          document.getElementById("statTotal").textContent = data.stats.total || 0;
          document.getElementById("statPromedio").textContent = (data.stats.promedio_rating || 0).toFixed(1);
          document.getElementById("statPositivos").textContent = data.stats.positivos || 0;
          document.getElementById("statNegativos").textContent = data.stats.negativos || 0;
          document.getElementById("statUsuarios").textContent = data.stats.usuarios_unicos || 0;
        }
      } catch (err) {
        console.error("Error cargando estadísticas:", err);
      }
    }

    async function cargarFeedback() {
      const tipo = document.getElementById("filterTipo").value;
      const rating = document.getElementById("filterRating").value;
      const limit = document.getElementById("filterLimit").value;

      const params = new URLSearchParams();
      if (tipo) params.append("tipo", tipo);
      if (rating) params.append("rating", rating);
      if (limit) params.append("limit", limit);

      try {
        const res = await fetch(`/feedback?${params.toString()}`);
        const data = await res.json();

        const container = document.getElementById("feedbackList");

        if (data.status === "ok" && data.feedback.length > 0) {
          container.innerHTML = data.feedback.map(f => crearTarjetaFeedback(f)).join("");
        } else {
          container.innerHTML = '<div class="loading">No hay feedback con estos filtros</div>';
        }
      } catch (err) {
        console.error("Error cargando feedback:", err);
        document.getElementById("feedbackList").innerHTML = '<div class="loading">Error cargando feedback</div>';
      }
    }

    function crearTarjetaFeedback(feedback) {
      const iconosTipo = {
        comentario: "💬",
        sugerencia: "💡",
        problema: "⚠️",
        felicitacion: "🎉"
      };

      const estrellas = Array.from({ length: 5 }, (_, i) => 
        i < feedback.rating 
          ? '<span class="star-filled">⭐</span>' 
          : '<span class="star-empty">⭐</span>'
      ).join("");

      const fecha = new Date(feedback.fecha).toLocaleString("es-CO", {
        year: "numeric",
        month: "long",
        day: "numeric",
        hour: "2-digit",
        minute: "2-digit"
      });

      return `
        <div class="feedback-card">
          <div class="feedback-header">
            <div class="feedback-user">
              <div class="user-avatar">${feedback.nombre.charAt(0).toUpperCase()}</div>
              <div class="user-info">
                <h3>${feedback.nombre}</h3>
                <p>${feedback.email}</p>
              </div>
            </div>
            <div class="feedback-meta">
              <span class="badge badge-${feedback.tipo}">${iconosTipo[feedback.tipo]} ${feedback.tipo.charAt(0).toUpperCase() + feedback.tipo.slice(1)}</span>
              <div class="rating">${estrellas}</div>
            </div>
          </div>
          <p class="feedback-message">${feedback.mensaje}</p>
          <div class="feedback-date">
            <i class="fa-solid fa-clock"></i>
            ${fecha}
          </div>
        </div>
      `;
    }

    // Cargar datos al iniciar
    document.addEventListener("DOMContentLoaded", () => {
      cargarEstadisticas();
      cargarFeedback();
    });

    // Actualizar cada 30 segundos
    setInterval(() => {
      cargarEstadisticas();
      cargarFeedback();
    }, 30000);
  </script>
  
  <script>
    // CANVAS PARTICLES (igual que index.html)
    const canvas = document.getElementById("bg-canvas");
    const ctx = canvas.getContext("2d");
    let pts = [];
    const mouse = { x: null, y: null };
    
    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      pts = [];
      const n = Math.min(100, Math.floor(window.innerWidth / 14));
      for (let i = 0; i < n; i++) pts.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        vx: (Math.random() - 0.5) * 0.5,
        vy: (Math.random() - 0.5) * 0.5
      });
    }
    
    function drawCanvas() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      pts.forEach((p, i) => {
        p.x += p.vx;
        p.y += p.vy;
        if (p.x < 0 || p.x > canvas.width) p.vx *= -1;
        if (p.y < 0 || p.y > canvas.height) p.vy *= -1;
        ctx.fillStyle = "rgba(56,189,248,0.6)";
        ctx.beginPath();
        ctx.arc(p.x, p.y, 1.8, 0, Math.PI * 2);
        ctx.fill();
        for (let j = i + 1; j < pts.length; j++) {
          const o = pts[j], dx = p.x - o.x, dy = p.y - o.y, d = dx * dx + dy * dy;
          if (d < 12000) {
            ctx.strokeStyle = `rgba(56,189,248,${0.5 - d / 24000})`;
            ctx.lineWidth = 0.5;
            ctx.beginPath();
            ctx.moveTo(p.x, p.y);
            ctx.lineTo(o.x, o.y);
            ctx.stroke();
          }
        }
        if (mouse.x) {
          const dx = p.x - mouse.x, dy = p.y - mouse.y, d = dx * dx + dy * dy;
          if (d < 18000) {
            ctx.strokeStyle = "rgba(99,102,241,0.3)";
            ctx.beginPath();
            ctx.moveTo(p.x, p.y);
            ctx.lineTo(mouse.x, mouse.y);
            ctx.stroke();
          }
        }
      });
      requestAnimationFrame(drawCanvas);
    }
    
    window.addEventListener("resize", resizeCanvas);
    window.addEventListener("mousemove", e => {
      mouse.x = e.clientX;
      mouse.y = e.clientY;
    });
    resizeCanvas();
    drawCanvas();
  </script>
</body>
</html>
