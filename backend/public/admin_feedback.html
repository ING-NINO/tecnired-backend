<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feedback de Clientes - Admin TecniRed</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      max-width: 1400px;
      margin: 0 auto;
    }
    .header {
      background: white;
      border-radius: 20px;
      padding: 30px;
      margin-bottom: 30px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
    }
    h1 {
      color: #333;
      font-size: 2rem;
      margin-bottom: 10px;
    }
    .subtitle {
      color: #666;
      font-size: 1rem;
    }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }
    .stat-card {
      background: white;
      border-radius: 15px;
      padding: 25px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.1);
      text-align: center;
    }
    .stat-icon {
      font-size: 2.5rem;
      margin-bottom: 10px;
    }
    .stat-value {
      font-size: 2rem;
      font-weight: bold;
      color: #667eea;
      margin-bottom: 5px;
    }
    .stat-label {
      color: #666;
      font-size: 0.9rem;
    }
    .filters {
      background: white;
      border-radius: 15px;
      padding: 20px;
      margin-bottom: 20px;
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
      align-items: center;
      box-shadow: 0 5px 20px rgba(0,0,0,0.1);
    }
    .filters label {
      font-weight: 600;
      color: #333;
    }
    .filters select {
      padding: 8px 15px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
      cursor: pointer;
    }
    .filters select:focus {
      border-color: #667eea;
    }
    .feedback-list {
      display: grid;
      gap: 20px;
    }
    .feedback-card {
      background: white;
      border-radius: 15px;
      padding: 25px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.1);
      transition: transform 0.3s ease;
    }
    .feedback-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
    }
    .feedback-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 15px;
      flex-wrap: wrap;
      gap: 10px;
    }
    .feedback-user {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .user-avatar {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      background: linear-gradient(135deg, #667eea, #764ba2);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: bold;
      font-size: 1.2rem;
    }
    .user-info h3 {
      font-size: 1rem;
      color: #333;
      margin-bottom: 2px;
    }
    .user-info p {
      font-size: 0.85rem;
      color: #666;
    }
    .feedback-meta {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }
    .badge {
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
    }
    .badge-comentario {
      background: #e3f2fd;
      color: #1976d2;
    }
    .badge-sugerencia {
      background: #fff3e0;
      color: #f57c00;
    }
    .badge-problema {
      background: #ffebee;
      color: #d32f2f;
    }
    .badge-felicitacion {
      background: #e8f5e9;
      color: #388e3c;
    }
    .rating {
      display: flex;
      gap: 3px;
      font-size: 1.1rem;
    }
    .star-filled {
      color: #fbbf24;
    }
    .star-empty {
      color: #e0e0e0;
    }
    .feedback-message {
      color: #444;
      line-height: 1.6;
      margin-bottom: 10px;
      font-size: 0.95rem;
    }
    .feedback-date {
      color: #999;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .back-button {
      display: inline-block;
      background: white;
      color: #667eea;
      padding: 12px 25px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: bold;
      margin-bottom: 20px;
      transition: all 0.3s ease;
    }
    .back-button:hover {
      background: #f0f0f0;
      transform: translateX(-5px);
    }
    .loading {
      text-align: center;
      color: white;
      font-size: 1.5rem;
      padding: 50px;
    }
    @media (max-width: 768px) {
      .stats-grid {
        grid-template-columns: 1fr 1fr;
      }
      .filters {
        flex-direction: column;
        align-items: stretch;
      }
      .filters select {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <a href="/admin.html" class="back-button">← Volver al Panel Admin</a>

    <div class="header">
      <h1>📊 Feedback de Clientes</h1>
      <p class="subtitle">Comentarios, sugerencias y calificaciones recibidas</p>
    </div>

    <div class="stats-grid" id="statsContainer">
      <div class="stat-card">
        <div class="stat-icon">📝</div>
        <div class="stat-value" id="statTotal">0</div>
        <div class="stat-label">Total Feedback</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon">⭐</div>
        <div class="stat-value" id="statPromedio">0.0</div>
        <div class="stat-label">Calificación Promedio</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon">😊</div>
        <div class="stat-value" id="statPositivos">0</div>
        <div class="stat-label">Feedback Positivo</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon">😞</div>
        <div class="stat-value" id="statNegativos">0</div>
        <div class="stat-label">Feedback Negativo</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon">👥</div>
        <div class="stat-value" id="statUsuarios">0</div>
        <div class="stat-label">Usuarios Únicos</div>
      </div>
    </div>

    <div class="filters">
      <label>Filtrar por tipo:</label>
      <select id="filterTipo" onchange="cargarFeedback()">
        <option value="">Todos</option>
        <option value="comentario">💬 Comentarios</option>
        <option value="sugerencia">💡 Sugerencias</option>
        <option value="problema">⚠️ Problemas</option>
        <option value="felicitacion">🎉 Felicitaciones</option>
      </select>

      <label>Filtrar por calificación:</label>
      <select id="filterRating" onchange="cargarFeedback()">
        <option value="">Todas</option>
        <option value="5">⭐⭐⭐⭐⭐ (5 estrellas)</option>
        <option value="4">⭐⭐⭐⭐ (4 estrellas)</option>
        <option value="3">⭐⭐⭐ (3 estrellas)</option>
        <option value="2">⭐⭐ (2 estrellas)</option>
        <option value="1">⭐ (1 estrella)</option>
      </select>

      <label>Mostrar:</label>
      <select id="filterLimit" onchange="cargarFeedback()">
        <option value="50">50 más recientes</option>
        <option value="100">100 más recientes</option>
        <option value="">Todos</option>
      </select>
    </div>

    <div class="feedback-list" id="feedbackList">
      <div class="loading">Cargando feedback...</div>
    </div>
  </div>

  <script>
    async function cargarEstadisticas() {
      try {
        const res = await fetch("/feedback/stats");
        const data = await res.json();

        if (data.status === "ok") {
          document.getElementById("statTotal").textContent = data.stats.total || 0;
          document.getElementById("statPromedio").textContent = (data.stats.promedio_rating || 0).toFixed(1);
          document.getElementById("statPositivos").textContent = data.stats.positivos || 0;
          document.getElementById("statNegativos").textContent = data.stats.negativos || 0;
          document.getElementById("statUsuarios").textContent = data.stats.usuarios_unicos || 0;
        }
      } catch (err) {
        console.error("Error cargando estadísticas:", err);
      }
    }

    async function cargarFeedback() {
      const tipo = document.getElementById("filterTipo").value;
      const rating = document.getElementById("filterRating").value;
      const limit = document.getElementById("filterLimit").value;

      const params = new URLSearchParams();
      if (tipo) params.append("tipo", tipo);
      if (rating) params.append("rating", rating);
      if (limit) params.append("limit", limit);

      try {
        const res = await fetch(`/feedback?${params.toString()}`);
        const data = await res.json();

        const container = document.getElementById("feedbackList");

        if (data.status === "ok" && data.feedback.length > 0) {
          container.innerHTML = data.feedback.map(f => crearTarjetaFeedback(f)).join("");
        } else {
          container.innerHTML = '<div class="loading">No hay feedback con estos filtros</div>';
        }
      } catch (err) {
        console.error("Error cargando feedback:", err);
        document.getElementById("feedbackList").innerHTML = '<div class="loading">Error cargando feedback</div>';
      }
    }

    function crearTarjetaFeedback(feedback) {
      const iconosTipo = {
        comentario: "💬",
        sugerencia: "💡",
        problema: "⚠️",
        felicitacion: "🎉"
      };

      const estrellas = Array.from({ length: 5 }, (_, i) => 
        i < feedback.rating 
          ? '<span class="star-filled">⭐</span>' 
          : '<span class="star-empty">⭐</span>'
      ).join("");

      const fecha = new Date(feedback.fecha).toLocaleString("es-CO", {
        year: "numeric",
        month: "long",
        day: "numeric",
        hour: "2-digit",
        minute: "2-digit"
      });

      return `
        <div class="feedback-card">
          <div class="feedback-header">
            <div class="feedback-user">
              <div class="user-avatar">${feedback.nombre.charAt(0).toUpperCase()}</div>
              <div class="user-info">
                <h3>${feedback.nombre}</h3>
                <p>${feedback.email}</p>
              </div>
            </div>
            <div class="feedback-meta">
              <span class="badge badge-${feedback.tipo}">${iconosTipo[feedback.tipo]} ${feedback.tipo.charAt(0).toUpperCase() + feedback.tipo.slice(1)}</span>
              <div class="rating">${estrellas}</div>
            </div>
          </div>
          <p class="feedback-message">${feedback.mensaje}</p>
          <div class="feedback-date">
            <i class="fa-solid fa-clock"></i>
            ${fecha}
          </div>
        </div>
      `;
    }

    // Cargar datos al iniciar
    document.addEventListener("DOMContentLoaded", () => {
      cargarEstadisticas();
      cargarFeedback();
    });

    // Actualizar cada 30 segundos
    setInterval(() => {
      cargarEstadisticas();
      cargarFeedback();
    }, 30000);
  </script>
</body>
</html>
