<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión de Usuarios - TecniRed</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    :root {
      --primary: #38bdf8; --primary-soft: #0ea5e9; --accent: #6366f1;
      --dark: #020617; --light: #f1f5f9; --muted: #94a3b8;
      --card-bg: rgba(15,23,42,0.7); --border: rgba(56,189,248,0.15);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: "Inter", sans-serif; }
    body {
      background: var(--dark);
      color: var(--light);
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
    }
    
    #bg-canvas {
      position: fixed;
      inset: 0;
      z-index: 0;
    }
    
    .container {
      position: relative;
      z-index: 1;
      max-width: 1400px;
      margin: 0 auto;
      padding: 20px;
    }
    
    .back-button {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--light);
      padding: 12px 25px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 600;
      margin-bottom: 30px;
      transition: all 0.3s ease;
      backdrop-filter: blur(20px);
    }
    .back-button:hover {
      border-color: var(--primary);
      transform: translateX(-5px);
      box-shadow: 0 8px 20px rgba(56,189,248,0.2);
    }
    
    .header {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 40px;
      margin-bottom: 30px;
      backdrop-filter: blur(20px);
      box-shadow: 0 10px 40px rgba(0,0,0,0.3);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 20px;
    }
    h1 {
      color: var(--light);
      font-size: 2.2rem;
      font-weight: 800;
    }
    
    .btn-primary {
      background: linear-gradient(135deg, var(--primary-soft), var(--primary));
      color: #06202c;
      padding: 12px 24px;
      border-radius: 12px;
      border: none;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(56,189,248,0.3);
    }
    
    .usuarios-table {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      backdrop-filter: blur(20px);
    }
    
    table {
      width: 100%;
      border-collapse: collapse;
    }
    th {
      background: rgba(56,189,248,0.1);
      padding: 16px;
      text-align: left;
      font-weight: 700;
      color: var(--primary);
      font-size: 0.9rem;
    }
    td {
      padding: 16px;
      border-top: 1px solid var(--border);
      font-size: 0.9rem;
    }
    tr:hover td {
      background: rgba(56,189,248,0.05);
    }
    
    .badge {
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 0.75rem;
      font-weight: 700;
      display: inline-block;
    }
    .badge-admin {
      background: rgba(239,68,68,0.15);
      color: #ef4444;
      border: 1px solid rgba(239,68,68,0.3);
    }
    .badge-asesor {
      background: rgba(56,189,248,0.15);
      color: var(--primary);
      border: 1px solid rgba(56,189,248,0.3);
    }
    .badge-cliente {
      background: rgba(148,163,184,0.15);
      color: var(--muted);
      border: 1px solid rgba(148,163,184,0.3);
    }
    
    .btn-action {
      padding: 6px 12px;
      border-radius: 8px;
      border: none;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      margin-right: 6px;
    }
    .btn-delete {
      background: rgba(239,68,68,0.15);
      color: #ef4444;
      border: 1px solid rgba(239,68,68,0.3);
    }
    .btn-delete:hover {
      background: rgba(239,68,68,0.25);
    }
    .btn-edit {
      background: rgba(245,158,11,0.15);
      color: #f59e0b;
      border: 1px solid rgba(245,158,11,0.3);
    }
    .btn-edit:hover {
      background: rgba(245,158,11,0.25);
    }
    
    /* Modal */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(5px);
    }
    .modal.active {
      display: flex;
    }
    .modal-content {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 40px;
      max-width: 500px;
      width: 90%;
      backdrop-filter: blur(20px);
    }
    .modal-header {
      margin-bottom: 24px;
    }
    .modal-header h2 {
      font-size: 1.5rem;
      color: var(--light);
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: var(--primary);
      font-size: 0.9rem;
    }
    .form-group input,
    .form-group select {
      width: 100%;
      padding: 12px;
      background: rgba(255,255,255,0.06);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--light);
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s;
    }
    .form-group input:focus,
    .form-group select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(56,189,248,0.1);
    }
    .form-group select option {
      background: #0f172a;
    }
    .modal-actions {
      display: flex;
      gap: 12px;
      margin-top: 24px;
    }
    .btn-cancel {
      flex: 1;
      padding: 12px;
      background: rgba(148,163,184,0.15);
      color: var(--muted);
      border: 1px solid rgba(148,163,184,0.3);
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-cancel:hover {
      background: rgba(148,163,184,0.25);
    }
    .btn-submit {
      flex: 1;
      padding: 12px;
      background: linear-gradient(135deg, var(--primary-soft), var(--primary));
      color: #06202c;
      border: none;
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-submit:hover {
      transform: translateY(-2px);
    }
    
    @media (max-width: 768px) {
      table {
        font-size: 0.8rem;
      }
      th, td {
        padding: 12px 8px;
      }
    }
  </style>
</head>
<body>
  <canvas id="bg-canvas"></canvas>
  
  <div class="container">
    <a href="/admin.html" class="back-button">
      <i class="fa-solid fa-arrow-left"></i>
      Volver al Panel Admin
    </a>

    <div class="header">
      <h1><i class="fa-solid fa-users"></i> Gestión de Usuarios</h1>
      <button class="btn-primary" onclick="abrirModalCrear()">
        <i class="fa-solid fa-user-plus"></i>
        Crear Usuario
      </button>
    </div>

    <div class="usuarios-table">
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Email</th>
            <th>Rol</th>
            <th>Plan</th>
            <th>Teléfono</th>
            <th>Registro</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="usuariosTable">
          <tr>
            <td colspan="8" style="text-align:center;padding:40px;color:var(--muted);">
              Cargando usuarios...
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Modal Crear Usuario -->
  <div class="modal" id="modalCrear">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Crear Nuevo Usuario</h2>
      </div>
      <form id="formCrear">
        <div class="form-group">
          <label>Nombre completo</label>
          <input type="text" id="crearNombre" required placeholder="Juan Pérez">
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="crearEmail" required placeholder="juan@ejemplo.com">
        </div>
        <div class="form-group">
          <label>Contraseña</label>
          <input type="password" id="crearPassword" required placeholder="Mínimo 8 caracteres">
        </div>
        <div class="form-group">
          <label>Teléfono</label>
          <input type="tel" id="crearTelefono" placeholder="300 123 4567">
        </div>
        <div class="form-group">
          <label>Rol</label>
          <select id="crearRol" required>
            <option value="">Selecciona un rol...</option>
            <option value="cliente">Cliente</option>
            <option value="asesor">Asesor General</option>
            <option value="asesor1">Asesor Nivel 1</option>
            <option value="asesor2">Asesor Nivel 2</option>
            <option value="asesor3">Asesor Nivel 3</option>
            <option value="admin">Administrador</option>
          </select>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn-cancel" onclick="cerrarModal()">Cancelar</button>
          <button type="submit" class="btn-submit">Crear Usuario</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    // Canvas de fondo
    const canvas = document.getElementById("bg-canvas");
    const ctx = canvas.getContext("2d");
    let pts = [];
    
    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      pts = [];
      const n = Math.min(100, Math.floor(window.innerWidth / 14));
      for (let i = 0; i < n; i++) pts.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        vx: (Math.random() - 0.5) * 0.5,
        vy: (Math.random() - 0.5) * 0.5
      });
    }
    
    function drawCanvas() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      pts.forEach((p, i) => {
        p.x += p.vx;
        p.y += p.vy;
        if (p.x < 0 || p.x > canvas.width) p.vx *= -1;
        if (p.y < 0 || p.y > canvas.height) p.vy *= -1;
        ctx.fillStyle = "rgba(56,189,248,0.6)";
        ctx.beginPath();
        ctx.arc(p.x, p.y, 1.8, 0, Math.PI * 2);
        ctx.fill();
        for (let j = i + 1; j < pts.length; j++) {
          const o = pts[j], dx = p.x - o.x, dy = p.y - o.y, d = dx * dx + dy * dy;
          if (d < 12000) {
            ctx.strokeStyle = `rgba(56,189,248,${0.5 - d / 24000})`;
            ctx.lineWidth = 0.5;
            ctx.beginPath();
            ctx.moveTo(p.x, p.y);
            ctx.lineTo(o.x, o.y);
            ctx.stroke();
          }
        }
      });
      requestAnimationFrame(drawCanvas);
    }
    
    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();
    drawCanvas();

    // Cargar usuarios
    async function cargarUsuarios() {
      try {
        const res = await fetch("/admin/usuarios");
        const data = await res.json();

        const tbody = document.getElementById("usuariosTable");

        if (data.status === "ok" && data.usuarios.length > 0) {
          tbody.innerHTML = data.usuarios.map(u => {
            const rolClass = u.rol === "admin" ? "badge-admin" : 
                            u.rol.includes("asesor") ? "badge-asesor" : "badge-cliente";
            
            const puedeEliminar = u.id !== 1; // No eliminar admin principal

            return `
              <tr>
                <td><strong>#${u.id}</strong></td>
                <td>${u.nombre}</td>
                <td>${u.email}</td>
                <td><span class="badge ${rolClass}">${u.rol}</span></td>
                <td>${u.plan || "gratis"}</td>
                <td>${u.telefono || "N/A"}</td>
                <td>${u.fecha_registro || "N/A"}</td>
                <td>
                  <button class="btn-action btn-edit" onclick="cambiarRol(${u.id}, '${u.rol}')">
                    <i class="fa-solid fa-pen"></i> Rol
                  </button>
                  ${puedeEliminar ? `
                    <button class="btn-action btn-delete" onclick="eliminarUsuario(${u.id}, '${u.nombre}')">
                      <i class="fa-solid fa-trash"></i>
                    </button>
                  ` : ''}
                </td>
              </tr>
            `;
          }).join("");
        } else {
          tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;padding:40px;color:var(--muted);">No hay usuarios registrados</td></tr>';
        }
      } catch (err) {
        console.error("Error cargando usuarios:", err);
      }
    }

    // Abrir modal crear
    function abrirModalCrear() {
      document.getElementById("modalCrear").classList.add("active");
    }

    // Cerrar modal
    function cerrarModal() {
      document.getElementById("modalCrear").classList.remove("active");
      document.getElementById("formCrear").reset();
    }

    // Crear usuario
    document.getElementById("formCrear").addEventListener("submit", async (e) => {
      e.preventDefault();

      const nombre = document.getElementById("crearNombre").value;
      const email = document.getElementById("crearEmail").value;
      const password = document.getElementById("crearPassword").value;
      const telefono = document.getElementById("crearTelefono").value;
      const rol = document.getElementById("crearRol").value;

      try {
        const res = await fetch("/admin/usuarios", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ nombre, email, password, telefono, rol })
        });

        const data = await res.json();

        if (data.status === "ok") {
          alert("Usuario creado correctamente");
          cerrarModal();
          cargarUsuarios();
        } else {
          alert(data.message || "Error al crear usuario");
        }
      } catch (err) {
        alert("Error de conexión");
      }
    });

    // Eliminar usuario
    async function eliminarUsuario(id, nombre) {
      if (!confirm(`¿Estás seguro de eliminar al usuario "${nombre}"? Esta acción no se puede deshacer.`)) {
        return;
      }

      try {
        const res = await fetch(`/admin/usuarios/${id}`, {
          method: "DELETE"
        });

        const data = await res.json();

        if (data.status === "ok") {
          alert("Usuario eliminado correctamente");
          cargarUsuarios();
        } else {
          alert(data.message || "Error al eliminar usuario");
        }
      } catch (err) {
        alert("Error de conexión");
      }
    }

    // Cambiar rol
    async function cambiarRol(id, rolActual) {
      const nuevoRol = prompt(`Cambiar rol del usuario (actual: ${rolActual})\n\nOpciones:\n- cliente\n- asesor\n- asesor1\n- asesor2\n- asesor3\n- admin`, rolActual);

      if (!nuevoRol || nuevoRol === rolActual) return;

      try {
        const res = await fetch(`/admin/usuarios/${id}/rol`, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ rol: nuevoRol })
        });

        const data = await res.json();

        if (data.status === "ok") {
          alert("Rol actualizado correctamente");
          cargarUsuarios();
        } else {
          alert(data.message || "Error al actualizar rol");
        }
      } catch (err) {
        alert("Error de conexión");
      }
    }

    // Cargar al inicio
    cargarUsuarios();

    // Actualizar cada 30 segundos
    setInterval(cargarUsuarios, 30000);
  </script>
</body>
</html>
