  </head>

  <body>
    <div class="container">
      <!-- SIDEBAR -->
      <div class="sidebar">
        <h2>📂 Tickets</h2>
        <div id="tickets"></div>
      </div>

      ```
      <!-- CHAT -->
      <div class="chat">
        <div class="topbar">
          <span id="usuario"></span>
          <button class="logout" onclick="logout()">Salir</button>
        </div>

        <div id="infoTicket"></div>

        <div class="messages" id="chat"></div>

        <div class="input-box">
          <input type="file" id="fileInput" hidden />
          <button onclick="abrirArchivo()">📎</button>

          <input id="mensaje" placeholder="Escribe mensaje..." />
          <button onclick="enviar()">➤</button>
        </div>
      </div>
    </div>

    <script>
      const socket = io();

      const usuario = JSON.parse(localStorage.getItem("usuario"));
      if (!usuario) window.location.href = "/";

      document.getElementById("usuario").textContent = usuario.email;

      let ticketActual = null;

      // ===== CARGAR TICKETS =====
      function cargarTickets() {
        fetch(`/tickets/asesor/${usuario.email}`)
          .then((res) => res.json())
          .then((data) => {
            const cont = document.getElementById("tickets");
            cont.innerHTML = "";

            data.forEach((t) => {
              const div = document.createElement("div");
              div.className = "ticket";
              div.innerHTML = `<b>#${t.id}</b><br>${t.categoria}`;

              div.onclick = () => {
                ticketActual = t.id;

                document
                  .querySelectorAll(".ticket")
                  .forEach((el) => el.classList.remove("active"));

                div.classList.add("active");

                document.getElementById("chat").innerHTML = "";

                document.getElementById("infoTicket").innerHTML =
                  `🎫 Ticket #${t.id}<br>${t.descripcion}`;

                socket.emit("joinTicket", ticketActual);

                cargarMensajes();
              };

              cont.appendChild(div);
            });
          });
      }

      // ===== AGREGAR MENSAJE =====
      function agregarMensaje(m) {
        const chat = document.getElementById("chat");

        const div = document.createElement("div");
        div.classList.add("msg");

        if (m.remitente === usuario.email) {
          div.classList.add("asesor");
        } else {
          div.classList.add("cliente");
        }

        const mensaje = m.mensaje.toLowerCase();

        // PDF
        if (mensaje.includes(".pdf") || mensaje.includes("raw/upload")) {
          const link = document.createElement("a");
          link.href = m.mensaje;
          link.target = "_blank";
          link.textContent = "📄 Ver PDF";

          const descargar = document.createElement("a");
          descargar.href = m.mensaje;
          descargar.download = "";
          descargar.textContent = "⬇ Descargar PDF";

          div.appendChild(link);
          div.appendChild(descargar);
        }

        // IMAGEN
        else if (mensaje.match(/\.(jpg|jpeg|png|gif|webp)$/)) {
          const img = document.createElement("img");
          img.src = m.mensaje;
          div.appendChild(img);
        }

        // VIDEO
        else if (mensaje.match(/\.(mp4|webm)$/)) {
          const video = document.createElement("video");
          video.src = m.mensaje;
          video.controls = true;
          div.appendChild(video);
        }

        // AUDIO
        else if (mensaje.match(/\.(mp3|wav|ogg)$/)) {
          const audio = document.createElement("audio");
          audio.src = m.mensaje;
          audio.controls = true;
          div.appendChild(audio);
        }

        // LINK
        else if (mensaje.startsWith("http")) {
          const link = document.createElement("a");
          link.href = m.mensaje;
          link.target = "_blank";
          link.textContent = "📎 Abrir archivo";
          div.appendChild(link);
        }

        // TEXTO
        else {
          div.textContent = m.mensaje;
        }

        chat.appendChild(div);
        chat.scrollTop = chat.scrollHeight;
      }

      // ===== CARGAR MENSAJES =====
      function cargarMensajes() {
        fetch(`/chat/${ticketActual}`)
          .then((res) => res.json())
          .then((data) => {
            const chat = document.getElementById("chat");
            chat.innerHTML = "";

            data.forEach(agregarMensaje);
          });
      }

      // ===== SOCKET TIEMPO REAL =====
      socket.on("nuevoMensaje", (m) => {
        if (m.ticket_id == ticketActual) {
          agregarMensaje(m);
        }
      });

      // ===== ENVIAR =====
      function enviar() {
        const input = document.getElementById("mensaje");

        if (!input.value.trim() || !ticketActual) return;

        fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            ticket_id: ticketActual,
            remitente: usuario.email,
            mensaje: input.value,
          }),
        });

        input.value = "";
      }

      // ===== ARCHIVOS =====
      function abrirArchivo() {
        document.getElementById("fileInput").click();
      }

      document.getElementById("fileInput").addEventListener("change", (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const formData = new FormData();
        formData.append("archivo", file);
        formData.append("ticket_id", ticketActual);
        formData.append("remitente", usuario.email);

        fetch("/chat/file", {
          method: "POST",
          body: formData,
        });
      });

      function logout() {
        localStorage.removeItem("usuario");
        window.location.href = "/";
      }

      cargarTickets();
    </script>
