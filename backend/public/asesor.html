<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Panel Asesor - TecniRed</title>

    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
      rel="stylesheet"
    />

    <style>
      body {
        margin: 0;
        font-family: Poppins;
        background: #0f172a;
        color: white;
      }

      .nav {
        background: #111c2f;
        padding: 15px;
        display: flex;
        justify-content: space-between;
      }

      .container {
        display: flex;
        height: 90vh;
      }

      /* LISTA TICKETS */
      .tickets {
        width: 30%;
        background: #1e293b;
        overflow: auto;
      }

      .ticket {
        padding: 15px;
        border-bottom: 1px solid #333;
        cursor: pointer;
      }

      .ticket:hover {
        background: #334155;
      }

      /* CHAT */
      .chat {
        width: 70%;
        display: flex;
        flex-direction: column;
      }

      .messages {
        flex: 1;
        padding: 20px;
        overflow: auto;
      }

      .msg {
        margin: 10px 0;
      }

      .user {
        text-align: left;
      }

      .asesor {
        text-align: right;
      }

      /* INPUT */
      .input {
        display: flex;
        padding: 10px;
        background: #111c2f;
      }

      input {
        flex: 1;
        padding: 10px;
      }

      button {
        padding: 10px;
        background: #1e90ff;
        color: white;
        border: none;
      }
    </style>
  </head>

  <body>
    <div class="nav">
      <h3>Panel Asesor</h3>
      <span id="correo"></span>
    </div>

    <div class="container">
      <div class="tickets" id="tickets"></div>

      <div class="chat">
        <div class="messages" id="messages"></div>

        <div class="input">
          <input id="msg" placeholder="Escribe mensaje..." />
          <button onclick="enviar()">Enviar</button>
        </div>
      </div>
    </div>

    <script>
      const user = JSON.parse(localStorage.getItem("usuario"));
      document.getElementById("correo").innerText = user.email;

      let ticketActual = null;

      // CARGAR TICKETS
      fetch(`/tickets/asesor/${user.email}`)
        .then((res) => res.json())
        .then((data) => {
          const cont = document.getElementById("tickets");

          data.forEach((t) => {
            const div = document.createElement("div");
            div.className = "ticket";
            div.innerHTML = `<b>${t.nombre}</b><br>${t.descripcion}`;

            div.onclick = () => {
              ticketActual = t.id;
              cargarMensajes();
            };

            cont.appendChild(div);
          });
        });

      // MENSAJES
      function cargarMensajes() {
        fetch(`/chat/${ticketActual}`)
          .then((res) => res.json())
          .then((data) => {
            const box = document.getElementById("messages");
            box.innerHTML = "";

            data.forEach((m) => {
              const div = document.createElement("div");
              div.className =
                "msg " + (m.remitente === user.email ? "asesor" : "user");
              div.innerText = m.mensaje;
              box.appendChild(div);
            });
          });
      }

      // ENVIAR
      function enviar() {
        const mensaje = document.getElementById("msg").value;

        fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            ticket_id: ticketActual,
            remitente: user.email,
            mensaje,
          }),
        }).then(() => {
          document.getElementById("msg").value = "";
          cargarMensajes();
        });
      }
    </script>
  </body>
</html>
