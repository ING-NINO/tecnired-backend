<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Panel Asesor | TecniRed</title>

    <!-- SOCKET -->
    <script src="/socket.io/socket.io.js"></script>

    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
      rel="stylesheet"
    />

    <style>
      :root {
        --primary: #4a8df5;
        --secondary: #00c6ff;
        --dark: #0b1629;
      }

      body {
        margin: 0;
        font-family: "Segoe UI";
        background: var(--dark);
        color: white;
      }

      .container {
        display: flex;
        height: 100vh;
      }

      .sidebar {
        width: 300px;
        background: #020617;
        padding: 20px;
        border-right: 1px solid #1e293b;
      }

      .ticket {
        padding: 12px;
        border-radius: 12px;
        margin-bottom: 10px;
        cursor: pointer;
        background: #0f172a;
      }

      .ticket.active {
        background: linear-gradient(135deg, var(--primary), var(--secondary));
      }

      .chat {
        flex: 1;
        display: flex;
        flex-direction: column;
      }

      .topbar {
        padding: 15px;
        background: #020617;
        display: flex;
        justify-content: space-between;
      }

      .messages {
        flex: 1;
        padding: 20px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .msg {
        max-width: 65%;
        padding: 12px;
        border-radius: 15px;
      }

      .cliente {
        align-self: flex-start;
        background: #334155;
      }

      .asesor {
        align-self: flex-end;
        background: linear-gradient(135deg, var(--primary), var(--secondary));
      }

      .input-box {
        display: flex;
        gap: 10px;
        padding: 15px;
        background: #020617;
      }

      .input-box input {
        flex: 1;
        padding: 12px;
        border-radius: 10px;
        border: none;
        background: #0f172a;
        color: white;
      }

      .input-box button {
        padding: 12px;
        border-radius: 10px;
        border: none;
        background: linear-gradient(135deg, var(--primary), var(--secondary));
        color: white;
        cursor: pointer;
      }

      .logout {
        background: red;
        padding: 8px 15px;
        border-radius: 8px;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <!-- SIDEBAR -->
      <div class="sidebar">
        <h2>📂 Tickets</h2>
        <div id="tickets"></div>
      </div>

      <!-- CHAT -->
      <div class="chat">
        <div class="topbar">
          <span id="usuario"></span>
          <button class="logout" onclick="logout()">Salir</button>
        </div>

        <div id="infoTicket" style="padding: 10px; color: #00c6ff"></div>

        <div class="messages" id="chat"></div>

        <div class="input-box">
          <input type="file" id="fileInput" hidden />
          <button onclick="abrirArchivo()">📎</button>

          <input id="mensaje" placeholder="Escribe mensaje..." />
          <button onclick="enviar()">➤</button>
        </div>
      </div>
    </div>

    <script>
      const socket = io();

      const usuario = JSON.parse(localStorage.getItem("usuario"));
      if (!usuario) window.location.href = "/";

      document.getElementById("usuario").textContent = usuario.email;

      let ticketActual = null;

      // ===== TICKETS =====
      function cargarTickets() {
        fetch(`/tickets/asesor/${usuario.email}`)
          .then((res) => res.json())
          .then((data) => {
            const cont = document.getElementById("tickets");
            cont.innerHTML = "";

            data.forEach((t) => {
              const div = document.createElement("div");
              div.className = "ticket";
              div.innerHTML = `<b>#${t.id}</b><br>${t.categoria}`;

              div.onclick = () => {
                ticketActual = t.id;

                document.getElementById("chat").innerHTML = "";

                document.getElementById("infoTicket").innerHTML =
                  `🎫 Ticket #${t.id} - ${t.categoria}<br>${t.descripcion}`;

                socket.emit("joinTicket", ticketActual);

                cargarMensajes();
              };

              cont.appendChild(div);
            });
          });
      }

      // ===== MENSAJES =====
      function agregarMensaje(m) {
        const chat = document.getElementById("chat");

        const div = document.createElement("div");
        div.classList.add("msg");

        if (m.remitente === usuario.email) {
          div.classList.add("asesor");
        } else {
          div.classList.add("cliente");
        }

        const mensaje = m.mensaje.toLowerCase();

        if (mensaje.endsWith(".pdf")) {
          const link = document.createElement("a");
          link.href = m.mensaje;
          link.target = "_blank";
          link.textContent = "📄 Ver PDF";
          div.appendChild(link);
        } else if (mensaje.match(/\.(jpg|png|jpeg|gif|webp)$/)) {
          const img = document.createElement("img");
          img.src = m.mensaje;
          div.appendChild(img);
        } else {
          div.textContent = m.mensaje;
        }

        chat.appendChild(div);
        chat.scrollTop = chat.scrollHeight;
      }

      function cargarMensajes() {
        fetch(`/chat/${ticketActual}`)
          .then((res) => res.json())
          .then((data) => {
            data.forEach(agregarMensaje);
          });
      }

      // ===== SOCKET REALTIME =====
      socket.on("nuevoMensaje", (m) => {
        if (m.ticket_id == ticketActual) {
          agregarMensaje(m);
        }
      });

      // ===== ENVIAR =====
      function enviar() {
        const input = document.getElementById("mensaje");

        if (!input.value || !ticketActual) return;

        fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            ticket_id: ticketActual,
            remitente: usuario.email,
            mensaje: input.value,
          }),
        });

        input.value = "";
      }

      function abrirArchivo() {
        document.getElementById("fileInput").click();
      }

      document.getElementById("fileInput").addEventListener("change", (e) => {
        const file = e.target.files[0];

        const formData = new FormData();
        formData.append("archivo", file);
        formData.append("ticket_id", ticketActual);
        formData.append("remitente", usuario.email);

        fetch("/chat/file", {
          method: "POST",
          body: formData,
        });
      });

      function logout() {
        localStorage.removeItem("usuario");
        window.location.href = "/";
      }

      cargarTickets();
    </script>
  </body>
</html>
