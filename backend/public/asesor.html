<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Panel Asesor | TecniRed</title>

    <script src="/socket.io/socket.io.js"></script>

    <!-- 🔥 FIREBASE -->
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
      import {
        getStorage,
        ref,
        uploadBytesResumable,
        getDownloadURL,
      } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";

      const firebaseConfig = {
        apiKey: "AIzaSyDkG2JyeF_mGwDx8dAL6BypVKLTzicSEe0",
        authDomain: "tecnired-221e0.firebaseapp.com",
        projectId: "tecnired-221e0",
        storageBucket: "tecnired-221e0.firebasestorage.app",
        appId: "1:247442670329:web:8a3215d5aeed054bd69828",
      };

      const app = initializeApp(firebaseConfig);
      window.storage = getStorage(app);
      window.ref = ref;
      window.uploadBytesResumable = uploadBytesResumable;
      window.getDownloadURL = getDownloadURL;
    </script>

    <style>
      body {
        margin: 0;
        font-family: "Segoe UI", sans-serif;
        background: linear-gradient(135deg, #0b1629, #020617);
        color: white;
      }

      .container {
        display: flex;
        height: 100vh;
      }

      .sidebar {
        width: 260px;
        background: #020617;
        padding: 20px;
        border-right: 1px solid #1e293b;
        overflow-y: auto;
      }

      .ticket {
        padding: 12px;
        border-radius: 10px;
        margin-bottom: 10px;
        cursor: pointer;
        background: #0f172a;
      }

      .ticket:hover {
        background: #1e293b;
      }

      .ticket.active {
        background: linear-gradient(135deg, #4a8df5, #00c6ff);
      }

      .chat {
        flex: 1;
        display: flex;
        flex-direction: column;
      }

      .topbar {
        padding: 15px;
        background: #020617;
        display: flex;
        justify-content: space-between;
        border-bottom: 1px solid #1e293b;
      }

      .messages {
        flex: 1;
        padding: 20px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .msg {
        max-width: 65%;
        padding: 12px;
        border-radius: 15px;
      }

      .asesor {
        align-self: flex-end;
        background: linear-gradient(135deg, #4a8df5, #00c6ff);
      }

      .cliente {
        align-self: flex-start;
        background: #334155;
      }

      .msg img {
        max-width: 200px;
        border-radius: 10px;
      }

      .input-box {
        display: flex;
        gap: 10px;
        padding: 15px;
        background: #020617;
        border-top: 1px solid #1e293b;
      }

      .input-box input {
        flex: 1;
        padding: 10px;
        border-radius: 10px;
        border: none;
      }

      button {
        background: #00c6ff;
        border: none;
        padding: 10px;
        border-radius: 10px;
        cursor: pointer;
      }

      #menuAdjuntos {
        display: none;
        position: absolute;
        bottom: 40px;
        background: #020617;
        padding: 10px;
        border-radius: 10px;
      }

      #progressBar {
        height: 4px;
        width: 0%;
        background: #00c6ff;
      }

      .empty {
        margin: auto;
        color: #94a3b8;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <aside class="sidebar">
        <h2>📂 Tickets</h2>
        <div id="tickets"></div>
      </aside>

      <section class="chat">
        <div class="topbar">
          <span id="usuario"></span>
          <button onclick="logout()">Salir</button>
        </div>

        <div id="progressBar"></div>
        <div class="messages" id="chat">
          <p class="empty">Selecciona un ticket para iniciar.</p>
        </div>

        <div class="input-box">
          <div style="position: relative">
            <button onclick="toggleMenu()">📎</button>
            <div id="menuAdjuntos">
              <button onclick="seleccionarArchivo('pdf')">PDF</button>
              <button onclick="seleccionarArchivo('img')">Imagen</button>
            </div>
          </div>

          <input type="file" id="fileInput" hidden />
          <input id="mensaje" placeholder="Escribe mensaje..." />
          <button onclick="enviar()">➤</button>
        </div>
      </section>
    </div>

    <script>
      const socket = io();

      const usuario = JSON.parse(localStorage.getItem("usuario"));
      if (!usuario || !usuario.rol || !usuario.rol.startsWith("asesor")) {
        location.href = "/";
      }

      document.getElementById("usuario").textContent = usuario.email;

      let ticketActual = null;
      let tipoArchivo = null;

      function toggleMenu() {
        const m = document.getElementById("menuAdjuntos");
        m.style.display = m.style.display === "none" ? "block" : "none";
      }

      function seleccionarArchivo(tipo) {
        tipoArchivo = tipo;
        const input = document.getElementById("fileInput");
        input.accept = tipo === "pdf" ? ".pdf" : "image/*";
        input.click();
        document.getElementById("menuAdjuntos").style.display = "none";
      }

      function cargarMensajes() {
        if (!ticketActual) return;

        fetch(`/chat/${ticketActual}`)
          .then((r) => r.json())
          .then((data) => {
            const chat = document.getElementById("chat");
            chat.innerHTML = "";

            if (!data.length) {
              chat.innerHTML = '<p class="empty">Aún no hay mensajes.</p>';
              return;
            }

            data.forEach(agregarMensaje);
            chat.scrollTop = chat.scrollHeight;
          });
      }

      async function subirArchivo(file) {
        const nombre = Date.now() + "_" + file.name;
        const storageRef = ref(storage, "tecnired/" + nombre);

        const uploadTask = uploadBytesResumable(storageRef, file);

        uploadTask.on(
          "state_changed",
          (snap) => {
            const progress = (snap.bytesTransferred / snap.totalBytes) * 100;
            document.getElementById("progressBar").style.width = progress + "%";
          },
          console.log,
          async () => {
            const url = await getDownloadURL(uploadTask.snapshot.ref);

            await fetch("/chat", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                ticket_id: ticketActual,
                remitente: usuario.email,
                mensaje: url,
              }),
            });

            agregarMensaje({
              ticket_id: ticketActual,
              remitente: usuario.email,
              mensaje: url,
            });

            document.getElementById("progressBar").style.width = "0%";
          },
        );
      }

      document.getElementById("fileInput").addEventListener("change", (e) => {
        const file = e.target.files[0];
        if (!file) return;

        if (tipoArchivo === "pdf" && file.type !== "application/pdf") {
          alert("Solo PDF");
          return;
        }

        if (tipoArchivo === "img" && !file.type.startsWith("image/")) {
          alert("Solo imagen");
          return;
        }

        subirArchivo(file);
      });

      function agregarMensaje(m) {
        const chat = document.getElementById("chat");
        const div = document.createElement("div");
        div.classList.add("msg");

        if (m.remitente === usuario.email) div.classList.add("asesor");
        else div.classList.add("cliente");

        const mensaje = String(m.mensaje || "").toLowerCase();

        if (mensaje.includes(".pdf")) {
          let url = m.mensaje;
          if (!url.includes("alt=media")) {
            url += url.includes("?") ? "&alt=media" : "?alt=media";
          }
          div.innerHTML = `<a href="${url}" target="_blank">📄 Ver PDF</a>`;
        } else if (mensaje.match(/\.(jpg|png|jpeg|gif|webp)/)) {
          div.innerHTML = `<img src="${m.mensaje}">`;
        } else {
          div.textContent = m.mensaje;
        }

        chat.appendChild(div);
        chat.scrollTop = chat.scrollHeight;
      }

      socket.on("nuevoMensaje", (m) => {
        if (Number(m.ticket_id) === Number(ticketActual)) agregarMensaje(m);
      });

      function cargarTickets() {
        fetch(`/tickets/asesor/${usuario.email}`)
          .then((r) => r.json())
          .then((data) => {
            const cont = document.getElementById("tickets");
            cont.innerHTML = "";

            if (!data.length) {
              cont.innerHTML = '<p class="empty">No tienes tickets asignados.</p>';
              return;
            }

            data.forEach((t, index) => {
              const div = document.createElement("div");
              div.className = "ticket";
              div.innerHTML = `#${t.id}<br>${t.categoria}`;

              div.onclick = () => {
                ticketActual = t.id;
                socket.emit("joinTicket", ticketActual);
                document
                  .querySelectorAll(".ticket")
                  .forEach((el) => el.classList.remove("active"));
                div.classList.add("active");
                cargarMensajes();
              };

              cont.appendChild(div);

              if (index === 0) {
                div.click();
              }
            });
          })
          .catch(() => {
            document.getElementById("tickets").innerHTML =
              '<p class="empty">Error cargando tickets.</p>';
          });
      }

      function enviar() {
        const input = document.getElementById("mensaje");
        if (!input.value.trim() || !ticketActual) return;

        fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            ticket_id: ticketActual,
            remitente: usuario.email,
            mensaje: input.value,
          }),
        });

        agregarMensaje({
          ticket_id: ticketActual,
          remitente: usuario.email,
          mensaje: input.value,
        });

        input.value = "";
      }

      function logout() {
        localStorage.removeItem("usuario");
        location.href = "/";
      }

      document.getElementById("mensaje").addEventListener("keydown", (e) => {
        if (e.key === "Enter") enviar();
      });

      cargarTickets();
    </script>
  </body>
</html>
