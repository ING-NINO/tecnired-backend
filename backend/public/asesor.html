<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Panel Asesor | TecniRed</title>

    <script src="/socket.io/socket.io.js"></script>

    <style>
      :root {
        --bg: #020617;
        --bg-soft: #0b1224;
        --panel: #0f172a;
        --panel-soft: #111c34;
        --line: #1e293b;
        --text: #e2e8f0;
        --muted: #94a3b8;
        --primary: #38bdf8;
        --primary-soft: #0ea5e9;
        --danger: #ef4444;
        --ok: #22c55e;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "Segoe UI", Arial, sans-serif;
        background: radial-gradient(circle at top, #0b1730 0%, var(--bg) 45%);
        color: var(--text);
        height: 100vh;
        overflow: hidden;
        scrollbar-color: #38bdf8 #0b1224;
        scrollbar-width: thin;
      }

      body::-webkit-scrollbar {
        width: 10px;
      }

      body::-webkit-scrollbar-track {
        background: #050b18;
      }

      body::-webkit-scrollbar-thumb {
        background: linear-gradient(180deg, #1d4ed8, #38bdf8);
        border-radius: 999px;
      }

      .layout {
        display: grid;
        grid-template-columns: 320px 1fr;
        height: 100vh;
        min-height: 0;
      }

      .sidebar {
        border-right: 1px solid var(--line);
        background: rgba(2, 6, 23, 0.82);
        backdrop-filter: blur(6px);
        padding: 20px;
        min-height: 0;
        overflow: hidden;
      }

      .brand {
        font-size: 1.2rem;
        font-weight: 700;
        margin: 0 0 16px;
      }

      .meta {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin-bottom: 16px;
      }

      .meta-card {
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--panel);
        padding: 10px;
      }

      .meta-card small {
        color: var(--muted);
        display: block;
      }

      .meta-card strong {
        font-size: 1.15rem;
      }

      .search {
        width: 100%;
        margin-bottom: 12px;
        padding: 11px 12px;
        border-radius: 10px;
        border: 1px solid var(--line);
        background: var(--panel);
        color: var(--text);
      }

      .tickets {
        max-height: calc(100vh - 440px);
        overflow-y: auto;
        padding-right: 4px;
      }

      .ticket {
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--panel);
        padding: 12px;
        margin-bottom: 10px;
        cursor: pointer;
      }

      .ticket:hover {
        border-color: #334155;
        transform: translateY(-1px);
      }

      .ticket.active {
        border-color: var(--primary);
        background: #0b2135;
      }

      .ticket h4 {
        margin: 0 0 6px;
        font-size: 0.95rem;
      }

      .ticket p {
        margin: 0;
        color: var(--muted);
        font-size: 0.82rem;
      }

      .ticket-problem {
        margin-top: 8px;
        color: var(--text);
        font-size: 0.84rem;
        line-height: 1.35;
      }

      .ticket-problem strong {
        color: var(--primary);
      }

      .badge {
        margin-top: 8px;
        display: inline-block;
        padding: 4px 8px;
        border-radius: 30px;
        font-size: 0.75rem;
        border: 1px solid #334155;
      }

      .main {
        display: grid;
        grid-template-rows: auto 1fr auto;
        min-height: 0;
      }

      .topbar {
        padding: 14px 20px;
        border-bottom: 1px solid var(--line);
        background: rgba(2, 6, 23, 0.85);
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
      }

      .topbar h2 {
        margin: 0;
        font-size: 1.05rem;
      }

      .muted {
        color: var(--muted);
        font-size: 0.85rem;
      }

      .ticket-detail {
        margin-top: 6px;
        max-width: 820px;
        color: var(--text);
        font-size: 0.9rem;
        line-height: 1.35;
      }

      .btn {
        border: none;
        border-radius: 10px;
        padding: 10px 12px;
        font-weight: 600;
        cursor: pointer;
      }

      .btn-out {
        background: var(--danger);
        color: white;
      }

      /* MODAL FINALIZAR */
      .modal-overlay {
        display: none;
        position: fixed; inset: 0; z-index: 999;
        background: rgba(0,0,0,0.7); backdrop-filter: blur(4px);
        align-items: center; justify-content: center;
      }
      .modal-overlay.open { display: flex; }
      .modal {
        background: #0f172a; border: 1px solid rgba(56,189,248,0.25);
        border-radius: 20px; padding: 32px; width: min(420px, 90vw);
        box-shadow: 0 30px 80px rgba(0,0,0,0.6);
      }
      .modal h3 { margin: 0 0 8px; font-size: 1.1rem; }
      .modal p { color: var(--muted); font-size: 0.88rem; margin-bottom: 20px; }
      .modal input {
        width: 100%; padding: 12px 14px;
        border: 1px solid var(--line); border-radius: 10px;
        background: #0b1224; color: var(--text);
        font-size: 0.95rem; margin-bottom: 16px;
      }
      .modal input:focus { outline: none; border-color: var(--primary); }
      .modal-btns { display: flex; gap: 10px; }
      .btn-confirm {
        flex: 1; background: var(--danger); color: white;
        border: none; border-radius: 10px; padding: 12px;
        font-weight: 700; cursor: pointer; transition: 0.2s;
      }
      .btn-confirm:hover { background: #dc2626; }
      .btn-cancel {
        flex: 1; background: rgba(255,255,255,0.06); color: var(--text);
        border: 1px solid var(--line); border-radius: 10px; padding: 12px;
        font-weight: 600; cursor: pointer; transition: 0.2s;
      }
      .btn-cancel:hover { background: rgba(255,255,255,0.1); }
      .btn-finalizar {
        background: var(--danger); color: white; font-size: 0.82rem;
        padding: 8px 14px;
      }

      .messages {
        overflow-y: auto;
        min-height: 0;
        padding: 18px;
        background: linear-gradient(180deg, rgba(15, 23, 42, 0.65), #090f1f);
        display: flex;
        flex-direction: column;
        gap: 10px;
        scroll-behavior: smooth;
      }

      .messages::-webkit-scrollbar {
        width: 10px;
      }

      .messages::-webkit-scrollbar-track {
        background: #0b1224;
        border-radius: 999px;
      }

      .messages::-webkit-scrollbar-thumb {
        background: linear-gradient(180deg, #38bdf8, #0ea5e9);
        border-radius: 999px;
      }

      .messages::-webkit-scrollbar-thumb:hover {
        background: linear-gradient(180deg, #67e8f9, #38bdf8);
      }

      .tickets::-webkit-scrollbar {
        width: 8px;
      }

      .tickets::-webkit-scrollbar-track {
        background: #060d1b;
        border-radius: 999px;
      }

      .tickets::-webkit-scrollbar-thumb {
        background: linear-gradient(180deg, #1e3a8a, #0ea5e9);
        border-radius: 999px;
      }

      .empty {
        margin: auto;
        text-align: center;
        color: var(--muted);
      }

      .bubble {
        max-width: min(75%, 620px);
        padding: 12px;
        border-radius: 12px;
        line-height: 1.35;
        word-break: break-word;
      }

      .mine {
        align-self: flex-end;
        background: linear-gradient(135deg, var(--primary-soft), var(--primary));
        color: #06202c;
      }

      .other {
        align-self: flex-start;
        background: #1e293b;
      }

      .bubble img {
        max-width: 100%;
        border-radius: 10px;
      }

      .composer {
        border-top: 1px solid var(--line);
        padding: 14px;
        background: rgba(2, 6, 23, 0.9);
      }

      .composer-row {
        display: grid;
        grid-template-columns: auto 1fr auto;
        gap: 10px;
      }

      .composer input[type="text"] {
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 12px;
        background: var(--panel);
        color: var(--text);
      }

      .btn-file {
        background: #1d4ed8;
        color: white;
      }

      .btn-send {
        background: var(--ok);
        color: #04250f;
      }

      #fileInput {
        display: none;
      }

      #progressWrap {
        margin-top: 10px;
        width: 100%;
        height: 6px;
        border-radius: 10px;
        background: #0b1224;
        overflow: hidden;
        display: none;
      }

      #progressBar {
        height: 100%;
        width: 0;
        background: var(--primary);
      }

      /* CHAT INTERNO ASESOR */
      .chat-interno {
        margin-top: 16px;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: rgba(2,6,23,0.6);
        display: flex;
        flex-direction: column;
        overflow: hidden;
        flex-shrink: 0;
      }
      .chat-interno-header {
        padding: 10px 14px;
        border-bottom: 1px solid var(--line);
        display: flex; align-items: center; gap: 8px;
        font-size: 0.82rem; font-weight: 700; color: var(--primary);
      }
      .chat-interno-header .dot-live {
        width: 7px; height: 7px; border-radius: 50%;
        background: var(--ok); box-shadow: 0 0 6px var(--ok);
        flex-shrink: 0;
      }
      .chat-interno-msgs {
        height: 160px;
        overflow-y: auto;
        padding: 10px 12px;
        display: flex; flex-direction: column; gap: 8px;
        scrollbar-width: thin; scrollbar-color: var(--line) transparent;
      }
      .chat-interno-msgs::-webkit-scrollbar { width: 3px; }
      .chat-interno-msgs::-webkit-scrollbar-thumb { background: var(--line); border-radius: 999px; }
      .ci-empty { color: var(--muted); font-size: 0.78rem; text-align: center; margin: auto; }
      .ci-bubble {
        max-width: 90%; padding: 7px 11px; border-radius: 10px;
        font-size: 0.78rem; line-height: 1.4; word-break: break-word;
      }
      .ci-mine { align-self: flex-end; background: linear-gradient(135deg, var(--primary-soft), var(--primary)); color: #06202c; border-radius: 10px 10px 3px 10px; }
      .ci-other { align-self: flex-start; background: #1e293b; color: var(--text); border-radius: 10px 10px 10px 3px; }
      .ci-sender { font-size: 0.65rem; color: var(--muted); margin-bottom: 3px; }
      .ci-time { font-size: 0.62rem; opacity: 0.6; margin-top: 3px; text-align: right; }
      .chat-interno-composer {
        display: flex; gap: 6px; padding: 8px 10px;
        border-top: 1px solid var(--line);
      }
      .chat-interno-composer input {
        flex: 1; padding: 7px 10px; background: rgba(255,255,255,0.05);
        border: 1px solid var(--line); border-radius: 8px;
        color: var(--text); font-size: 0.78rem; outline: none;
        margin-bottom: 0;
      }
      .chat-interno-composer input:focus { border-color: var(--primary); }
      .ci-send-btn {
        background: linear-gradient(135deg, var(--primary-soft), var(--primary));
        color: #06202c; border: none; border-radius: 8px;
        width: 32px; height: 32px; display: grid; place-items: center;
        cursor: pointer; font-size: 0.8rem; flex-shrink: 0;
        transition: transform 0.2s;
      }
      .ci-send-btn:hover { transform: scale(1.1); }

      @media (max-width: 900px) {
        .layout {
          grid-template-columns: 1fr;
          grid-template-rows: auto 1fr;
        }
        .sidebar {
          max-height: 50vh;
          border-right: none;
          border-bottom: 1px solid var(--line);
        }
        .tickets {
          max-height: 18vh;
        }
      }
    </style>
  </head>

  <body>
    <div class="layout">
      <!-- MODAL FINALIZAR TICKET -->
      <div class="modal-overlay" id="modalFinalizar">
        <div class="modal">
          <h3>⚠️ Finalizar Ticket</h3>
          <p>Escribe el número del ticket para confirmar el cierre. Esta acción cerrará el chat con el cliente.</p>
          <input type="number" id="inputTicketFinalizar" placeholder="Número de ticket (ej: 42)" min="1" />
          <div class="modal-btns">
            <button class="btn-cancel" onclick="cerrarModal()">Cancelar</button>
            <button class="btn-confirm" onclick="confirmarFinalizar()">Finalizar ticket</button>
          </div>
        </div>
      </div>
      <aside class="sidebar">
        <h1 class="brand">🧑‍💻 Panel Asesor</h1>

        <div class="meta">
          <div class="meta-card">
            <small>Tickets</small>
            <strong id="totalTickets">0</strong>
          </div>
          <div class="meta-card">
            <small>Seleccionado</small>
            <strong id="ticketSeleccionado">-</strong>
          </div>
        </div>

        <input
          class="search"
          id="buscarTicket"
          placeholder="Buscar por #ticket, cliente o categoría"
        />

        <div id="tickets" class="tickets"></div>

        <!-- CHAT INTERNO CON ADMIN -->
        <div class="chat-interno">
          <div class="chat-interno-header">
            <span class="dot-live"></span>
            <i class="fa-solid fa-comments"></i> Chat con Admin
          </div>
          <div class="chat-interno-msgs" id="ciMsgs">
            <div class="ci-empty" id="ciEmpty">Sin mensajes aún</div>
          </div>
          <div class="chat-interno-composer">
            <input type="text" id="ciInput" placeholder="Mensaje al admin..." />
            <button class="ci-send-btn" id="ciSendBtn" title="Enviar">
              <i class="fa-solid fa-paper-plane"></i>
            </button>
          </div>
        </div>
      </aside>

      <main class="main">
        <header class="topbar">
          <div>
            <h2 id="encabezado">Sin ticket seleccionado</h2>
            <div class="muted" id="subencabezado">
              Elige un ticket del panel izquierdo.
            </div>
            <div class="ticket-detail" id="detalleProblema"></div>
          </div>

          <div>
            <span class="muted" id="usuario"></span>
            <button class="btn btn-finalizar" onclick="abrirModal()" style="margin-right:8px">🔒 Finalizar Ticket</button>
            <button class="btn btn-out" onclick="cerrarSesion()">Salir</button>
          </div>
        </header>

        <section class="messages" id="chat">
          <div class="empty" id="emptyChat">Selecciona un ticket para iniciar.</div>
        </section>

        <footer class="composer">
          <div class="composer-row">
            <button class="btn btn-file" onclick="adjuntarArchivo()">📎 Archivo</button>
            <input id="mensaje" type="text" placeholder="Escribe un mensaje..." />
            <button class="btn btn-send" onclick="enviarTexto()">Enviar</button>
          </div>
          <input id="fileInput" type="file" accept="image/*,.pdf" />
          <div id="progressWrap"><div id="progressBar"></div></div>
        </footer>
      </main>
    </div>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
      import {
        getStorage,
        ref,
        uploadBytesResumable,
        getDownloadURL,
      } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";

      const firebaseConfig = {
        apiKey: "AIzaSyDkG2JyeF_mGwDx8dAL6BypVKLTzicSEe0",
        authDomain: "tecnired-221e0.firebaseapp.com",
        projectId: "tecnired-221e0",
        storageBucket: "tecnired-221e0.firebasestorage.app",
        appId: "1:247442670329:web:8a3215d5aeed054bd69828",
      };

      const storage = getStorage(initializeApp(firebaseConfig));
      const socket = io();
      socket.emit("joinAdmin"); // asesores también entran al canal interno

      const usuario = JSON.parse(localStorage.getItem("usuario"));
      if (!usuario || !usuario.rol || !usuario.rol.startsWith("asesor")) {
        window.location.href = "/";
      }

      document.getElementById("usuario").textContent = usuario.email;

      const ui = {
        tickets: document.getElementById("tickets"),
        chat: document.getElementById("chat"),
        emptyChat: document.getElementById("emptyChat"),
        buscarTicket: document.getElementById("buscarTicket"),
        totalTickets: document.getElementById("totalTickets"),
        ticketSeleccionado: document.getElementById("ticketSeleccionado"),
        encabezado: document.getElementById("encabezado"),
        subencabezado: document.getElementById("subencabezado"),
        detalleProblema: document.getElementById("detalleProblema"),
        mensaje: document.getElementById("mensaje"),
        fileInput: document.getElementById("fileInput"),
        progressWrap: document.getElementById("progressWrap"),
        progressBar: document.getElementById("progressBar"),
      };

      let tickets = [];
      let ticketActual = null;

      function escaparHtml(valor) {
        return String(valor ?? "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      function renderTicketList() {
        const q = ui.buscarTicket.value.trim().toLowerCase();

        const filtrados = tickets.filter((t) => {
          const texto =
            `${t.id} ${t.nombre || ""} ${t.categoria || ""} ${t.descripcion || ""}`.toLowerCase();
          return texto.includes(q);
        });

        ui.tickets.innerHTML = "";

        filtrados.forEach((t) => {
          const item = document.createElement("article");
          item.className = "ticket" + (ticketActual === t.id ? " active" : "");
          item.innerHTML = `
            <h4>#${escaparHtml(t.id)} · ${escaparHtml(t.categoria || "Sin categoría")}</h4>
            <p>${escaparHtml(t.nombre || "Cliente")} · ${escaparHtml(t.email || "Sin correo")}</p>
            <div class="ticket-problem">
              <strong>Problema:</strong> ${escaparHtml(t.descripcion || "Sin descripción")}
            </div>
            <span class="badge">${t.estado || "Sin estado"}</span>
          `;

          item.addEventListener("click", () => seleccionarTicket(t));
          ui.tickets.appendChild(item);
        });

        if (!filtrados.length) {
          ui.tickets.innerHTML = '<p class="muted">No hay tickets para mostrar.</p>';
        }

        ui.totalTickets.textContent = tickets.length;
      }

      function pintarMensaje(m) {
        const bubble = document.createElement("div");
        bubble.className =
          "bubble " + (m.remitente === usuario.email ? "mine" : "other");

        const lower = String(m.mensaje || "").toLowerCase();

        if (lower.includes(".pdf")) {
          const link = document.createElement("a");
          link.href = m.mensaje;
          link.target = "_blank";
          link.textContent = "📄 Ver PDF";
          link.style.color = "inherit";
          link.style.fontWeight = "700";
          bubble.appendChild(link);
        } else if (lower.match(/\.(jpg|png|jpeg|gif|webp)/)) {
          const img = document.createElement("img");
          img.src = m.mensaje;
          img.alt = "Adjunto";
          bubble.appendChild(img);
        } else {
          bubble.textContent = m.mensaje;
        }

        ui.chat.appendChild(bubble);
        ui.chat.scrollTop = ui.chat.scrollHeight;
      }

      async function cargarMensajes() {
        if (!ticketActual) return;

        const res = await fetch(`/chat/${ticketActual}`);
        const data = await res.json();

        ui.chat.innerHTML = "";

        // Verificar si el ticket está finalizado
        const ticketInfo = tickets.find(t => t.id === ticketActual);
        const esFinalizado = ticketInfo && ticketInfo.estado === "Finalizado";

        if (!data.length) {
          ui.chat.innerHTML = '<p class="empty">Aún no hay mensajes.</p>';
        } else {
          data.forEach(pintarMensaje);
        }

        // Si está finalizado, mostrar banner al final
        if (esFinalizado) {
          const aviso = document.createElement("div");
          aviso.id = "avisoCierre";
          aviso.style.cssText = "text-align:center;color:#ef4444;font-size:0.85rem;padding:12px 16px;background:rgba(239,68,68,0.1);border-radius:10px;border:1px solid rgba(239,68,68,0.3);margin-top:8px;flex-shrink:0;";
          aviso.textContent = "🔒 Este ticket fue finalizado. El chat está cerrado.";
          ui.chat.appendChild(aviso);
          ui.chat.scrollTop = ui.chat.scrollHeight;
        }
      }

      function seleccionarTicket(t) {
        ticketActual = t.id;
        socket.emit("joinTicket", ticketActual);

        ui.ticketSeleccionado.textContent = `#${t.id}`;
        ui.encabezado.textContent = `Ticket #${t.id} · ${t.categoria || "Sin categoría"}`;
        ui.subencabezado.textContent = `${t.nombre || "Cliente"} · ${t.email || "Sin correo"}`;
        ui.detalleProblema.textContent = `Problema: ${t.descripcion || "Sin descripción"}`;

        renderTicketList();
        cargarMensajes();
      }

      async function cargarTickets() {
        try {
          const res = await fetch(`/tickets/asesor/${usuario.email}`);
          tickets = await res.json();
          renderTicketList();

          if (!ticketActual && tickets.length) {
            seleccionarTicket(tickets[0]);
          }
        } catch (e) {
          ui.tickets.innerHTML =
            '<p class="muted">No se pudo cargar la lista de tickets.</p>';
        }
      }

      async function enviarMensaje(mensaje) {
        if (!ticketActual || !mensaje) return;

        await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            ticket_id: ticketActual,
            remitente: usuario.email,
            mensaje,
          }),
        });
      }

      window.enviarTexto = async function () {
        const texto = ui.mensaje.value.trim();
        if (!texto || !ticketActual) return;

        await enviarMensaje(texto);
        ui.mensaje.value = "";
      };

      window.adjuntarArchivo = function () {
        if (!ticketActual) {
          alert("Primero selecciona un ticket.");
          return;
        }
        ui.fileInput.click();
      };

      ui.fileInput.addEventListener("change", async (e) => {
        const file = e.target.files?.[0];
        if (!file) return;

        const nombre = `${Date.now()}_${file.name}`;
        const storageRef = ref(storage, `tecnired/${nombre}`);
        const task = uploadBytesResumable(storageRef, file);

        ui.progressWrap.style.display = "block";

        task.on(
          "state_changed",
          (snap) => {
            const progress = (snap.bytesTransferred / snap.totalBytes) * 100;
            ui.progressBar.style.width = `${progress}%`;
          },
          () => {
            alert("No fue posible subir el archivo.");
            ui.progressWrap.style.display = "none";
            ui.progressBar.style.width = "0%";
          },
          async () => {
            const url = await getDownloadURL(task.snapshot.ref);
            await enviarMensaje(url);
            ui.progressWrap.style.display = "none";
            ui.progressBar.style.width = "0%";
            ui.fileInput.value = "";
          },
        );
      });

      ui.mensaje.addEventListener("keydown", async (e) => {
        if (e.key === "Enter") {
          e.preventDefault();
          await window.enviarTexto();
        }
      });

      ui.buscarTicket.addEventListener("input", renderTicketList);

      socket.on("nuevoMensaje", (m) => {
        if (Number(m.ticket_id) !== Number(ticketActual)) return;
        if (ui.emptyChat) ui.emptyChat.remove();
        pintarMensaje(m);
      });

      window.cerrarSesion = function () {
        localStorage.removeItem("usuario");
        window.location.href = "/";
      };

      // ===== MODAL FINALIZAR =====
      window.abrirModal = function () {
        document.getElementById("inputTicketFinalizar").value = ticketActual || "";
        document.getElementById("modalFinalizar").classList.add("open");
      };

      window.cerrarModal = function () {
        document.getElementById("modalFinalizar").classList.remove("open");
      };

      window.confirmarFinalizar = async function () {
        const id = parseInt(document.getElementById("inputTicketFinalizar").value);
        if (!id || isNaN(id)) {
          alert("Ingresa un número de ticket válido.");
          return;
        }

        const res = await fetch(`/tickets/${id}`, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ estado: "Finalizado" }),
        });

        if (res.ok) {
          cerrarModal();
          // Marca el ticket como finalizado en la lista local
          tickets = tickets.map(t => t.id === id ? { ...t, estado: "Finalizado" } : t);
          renderTicketList();
          // Recarga los mensajes del ticket activo para mostrar el banner de cierre
          if (ticketActual === id) {
            await cargarMensajes();
          }
        } else {
          alert("No se pudo finalizar el ticket. Verifica el número.");
        }
      };

      // Cerrar modal con Escape
      document.addEventListener("keydown", e => { if (e.key === "Escape") cerrarModal(); });

      // ===== CHAT INTERNO CON ADMIN =====
      // Cargar historial al conectar
      async function cargarHistorialChatInterno() {
        try {
          const res = await fetch("/chat-interno");
          const msgs = await res.json();
          if (msgs.length) {
            const empty = document.getElementById("ciEmpty");
            if (empty) empty.remove();
            msgs.forEach(m => {
              const hora = new Date(m.hora).toLocaleTimeString("es-CO", { hour: "2-digit", minute: "2-digit" });
              ciRenderMensaje({ remitente: m.remitente, texto: m.texto, hora }, true);
            });
          }
        } catch (e) { /* tabla puede no existir aún */ }
      }

      function ciRenderMensaje(m, esHistorial = false) {
        const empty = document.getElementById("ciEmpty");
        if (empty) empty.remove();
        const isMine = m.remitente === usuario.email;
        const msgs = document.getElementById("ciMsgs");
        const wrap = document.createElement("div");
        wrap.style.display = "flex";
        wrap.style.flexDirection = "column";
        wrap.innerHTML = `
          ${!isMine ? `<div class="ci-sender">${m.remitente}</div>` : ""}
          <div class="ci-bubble ${isMine ? "ci-mine" : "ci-other"}">
            ${m.texto}
            <div class="ci-time">${m.hora}</div>
          </div>`;
        msgs.appendChild(wrap);
        msgs.scrollTop = msgs.scrollHeight;
      }

      function ciEnviar() {
        const input = document.getElementById("ciInput");
        const texto = input.value.trim();
        if (!texto) return;
        const m = {
          remitente: usuario.email,
          texto,
          hora: new Date().toLocaleTimeString("es-CO", { hour: "2-digit", minute: "2-digit" })
        };
        socket.emit("mensajeInterno", m);
        input.value = "";
      }

      // Recibir mensajes del servidor (ya persistidos)
      socket.on("mensajeInterno", (m) => {
        ciRenderMensaje(m);
      });

      document.getElementById("ciSendBtn").addEventListener("click", ciEnviar);
      document.getElementById("ciInput").addEventListener("keydown", e => {
        if (e.key === "Enter") { e.preventDefault(); ciEnviar(); }
      });

      cargarTickets();
      cargarHistorialChatInterno();
    </script>
  </body>
</html>
