<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Panel Asesor | TecniRed</title>

    <script src="/socket.io/socket.io.js"></script>

    <!-- 🔥 FIREBASE -->
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
      import {
        getStorage,
        ref,
        uploadBytes,
        getDownloadURL,
      } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";

      const firebaseConfig = {
        apiKey: "AIzaSyDkG2JyeF_mGwDx8dAL6BypVKLTzicSEe0",
        authDomain: "tecnired-221e0.firebaseapp.com",
        projectId: "tecnired-221e0",
        storageBucket: "tecnired-221e0.firebasestorage.app",
        appId: "1:247442670329:web:8a3215d5aeed054bd69828",
      };

      const app = initializeApp(firebaseConfig);
      window.storage = getStorage(app);
      window.ref = ref;
      window.uploadBytes = uploadBytes;
      window.getDownloadURL = getDownloadURL;
    </script>

    <style>
      body {
        margin: 0;
        font-family: "Segoe UI";
        background: #0b1629;
        color: white;
      }

      .container {
        display: flex;
        height: 100vh;
      }

      .sidebar {
        width: 280px;
        background: #020617;
        padding: 20px;
        overflow-y: auto;
      }

      .ticket {
        padding: 12px;
        border-radius: 10px;
        margin-bottom: 10px;
        cursor: pointer;
        background: #0f172a;
      }

      .ticket.active {
        background: linear-gradient(135deg, #4a8df5, #00c6ff);
      }

      .chat {
        flex: 1;
        display: flex;
        flex-direction: column;
      }

      .topbar {
        padding: 15px;
        background: #020617;
        display: flex;
        justify-content: space-between;
      }

      .logout {
        background: red;
        border: none;
        padding: 8px 12px;
        color: white;
        cursor: pointer;
        border-radius: 6px;
      }

      .messages {
        flex: 1;
        padding: 20px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .msg {
        max-width: 65%;
        padding: 12px;
        border-radius: 15px;
      }

      .asesor {
        align-self: flex-end;
        background: linear-gradient(135deg, #4a8df5, #00c6ff);
      }

      .cliente {
        align-self: flex-start;
        background: #334155;
      }

      .msg img {
        max-width: 200px;
        border-radius: 10px;
      }

      .input-box {
        display: flex;
        gap: 10px;
        padding: 15px;
        background: #020617;
      }

      .input-box input {
        flex: 1;
        padding: 10px;
        border-radius: 10px;
        border: none;
      }

      .input-box button {
        padding: 10px;
        border: none;
        background: #00c6ff;
        color: white;
        border-radius: 10px;
        cursor: pointer;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <div class="sidebar">
        <h2>📂 Tickets</h2>
        <div id="tickets"></div>
      </div>

      <div class="chat">
        <div class="topbar">
          <span id="usuario"></span>
          <button class="logout" onclick="logout()">Salir</button>
        </div>

        <div id="infoTicket"></div>
        <div class="messages" id="chat"></div>

        <div class="input-box">
          <input type="file" id="fileInput" hidden />
          <button onclick="abrirArchivo()">📎</button>

          <input id="mensaje" placeholder="Escribe mensaje..." />
          <button onclick="enviar()">➤</button>
        </div>
      </div>
    </div>

    <script>
      const socket = io("https://TU-APP.onrender.com");

      const usuario = JSON.parse(localStorage.getItem("usuario"));
      if (!usuario) window.location.href = "/";

      document.getElementById("usuario").textContent = usuario.email;

      let ticketActual = null;

      /* ================= TICKETS ================= */
      function cargarTickets() {
        fetch(`/tickets/asesor/${usuario.email}`)
          .then((res) => res.json())
          .then((data) => {
            const cont = document.getElementById("tickets");
            cont.innerHTML = "";

            data.forEach((t) => {
              const div = document.createElement("div");
              div.className = "ticket";
              div.innerHTML = `<b>#${t.id}</b><br>${t.categoria}`;

              div.onclick = () => {
                ticketActual = t.id;

                document
                  .querySelectorAll(".ticket")
                  .forEach((el) => el.classList.remove("active"));
                div.classList.add("active");

                document.getElementById("chat").innerHTML = "";
                document.getElementById("infoTicket").innerHTML =
                  `🎫 Ticket #${t.id}<br>${t.descripcion}`;

                socket.emit("joinTicket", ticketActual);
                cargarMensajes();
              };

              cont.appendChild(div);
            });
          });
      }

      /* ================= MENSAJES ================= */
      function agregarMensaje(m) {
        const chat = document.getElementById("chat");

        const div = document.createElement("div");
        div.classList.add("msg");

        if (m.remitente === usuario.email) div.classList.add("asesor");
        else div.classList.add("cliente");

        const mensaje = m.mensaje.toLowerCase();

        /* 🔥 PDF CORREGIDO */
        if (
          mensaje.includes(".pdf") ||
          mensaje.includes("application/pdf") ||
          mensaje.includes("firebasestorage")
        ) {
          let url = m.mensaje;

          // 🔥 SOLUCIÓN FINAL
          if (!url.includes("alt=media")) {
            url += "?alt=media";
          }

          const link = document.createElement("a");
          link.href = url;
          link.target = "_blank";
          link.innerHTML = "📄 Ver PDF";
          link.style.color = "#00c6ff";

          div.appendChild(link);
        } else if (mensaje.match(/\.(jpg|jpeg|png|gif|webp)/)) {
          /* 🖼️ IMAGEN */
          const img = document.createElement("img");
          img.src = m.mensaje;
          div.appendChild(img);
        } else if (mensaje.match(/\.(mp4|webm)/)) {
          /* 🎥 VIDEO */
          const video = document.createElement("video");
          video.src = m.mensaje;
          video.controls = true;
          video.style.maxWidth = "250px";
          div.appendChild(video);
        } else if (mensaje.match(/\.(mp3|wav|ogg)/)) {
          /* 🎧 AUDIO */
          const audio = document.createElement("audio");
          audio.src = m.mensaje;
          audio.controls = true;
          div.appendChild(audio);
        } else if (mensaje.startsWith("http")) {
          /* 🔗 LINK */
          const link = document.createElement("a");
          link.href = m.mensaje;
          link.target = "_blank";
          link.textContent = "📎 Abrir archivo";
          div.appendChild(link);
        } else {
          /* 💬 TEXTO */
          div.textContent = m.mensaje;
        }

        chat.appendChild(div);
        chat.scrollTop = chat.scrollHeight;
      }

      function cargarMensajes() {
        fetch(`/chat/${ticketActual}`)
          .then((res) => res.json())
          .then((data) => {
            const chat = document.getElementById("chat");
            chat.innerHTML = "";
            data.forEach(agregarMensaje);
          });
      }

      socket.on("nuevoMensaje", (m) => {
        if (m.ticket_id == ticketActual) {
          agregarMensaje(m);
        }
      });

      /* ================= ENVIAR ================= */
      function enviar() {
        const input = document.getElementById("mensaje");

        if (!input.value.trim() || !ticketActual) return;

        fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            ticket_id: ticketActual,
            remitente: usuario.email,
            mensaje: input.value,
          }),
        });

        input.value = "";
      }

      /* ================= SUBIR ARCHIVO ================= */
      async function subirArchivo(file) {
        const nombre = Date.now() + "_" + file.name;
        const storageRef = ref(storage, "tecnired/" + nombre);

        await uploadBytes(storageRef, file);
        const url = await getDownloadURL(storageRef);

        await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            ticket_id: ticketActual,
            remitente: usuario.email,
            mensaje: url,
          }),
        });
      }

      function abrirArchivo() {
        document.getElementById("fileInput").click();
      }

      document.getElementById("fileInput").addEventListener("change", (e) => {
        const file = e.target.files[0];
        if (!file) return;

        subirArchivo(file);
      });

      /* ================= LOGOUT ================= */
      function logout() {
        localStorage.removeItem("usuario");
        window.location.href = "/";
      }

      cargarTickets();
    </script>
  </body>
</html>
