<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Panel Asesor | TecniRed</title>

    <script src="/socket.io/socket.io.js"></script>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
      import {
        getStorage,
        ref,
        uploadBytesResumable,
        getDownloadURL,
      } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";

      const firebaseConfig = {
        apiKey: "AIzaSy...",
        authDomain: "tecnired-221e0.firebaseapp.com",
        projectId: "tecnired-221e0",
        storageBucket: "tecnired-221e0.firebasestorage.app",
        appId: "1:247442670329:web:8a3215d5aeed054bd69828",
      };

      const app = initializeApp(firebaseConfig);
      window.storage = getStorage(app);
      window.ref = ref;
      window.uploadBytesResumable = uploadBytesResumable;
      window.getDownloadURL = getDownloadURL;
    </script>

    <style>
      body {
        margin: 0;
        font-family: "Segoe UI";
        background: linear-gradient(135deg, #0b1629, #020617);
        color: white;
      }

      /* ===== LAYOUT ===== */
      .container {
        display: flex;
        height: 100vh;
      }

      /* ===== SIDEBAR ===== */
      .sidebar {
        width: 260px;
        background: rgba(2, 6, 23, 0.9);
        backdrop-filter: blur(10px);
        padding: 20px;
      }

      .ticket {
        padding: 12px;
        border-radius: 12px;
        margin-bottom: 10px;
        cursor: pointer;
        background: #0f172a;
        transition: 0.3s;
      }

      .ticket:hover {
        transform: translateX(5px);
        background: #1e293b;
      }

      .ticket.active {
        background: linear-gradient(135deg, #4a8df5, #00c6ff);
      }

      /* ===== CHAT ===== */
      .chat {
        flex: 1;
        display: flex;
        flex-direction: column;
      }

      .topbar {
        padding: 15px;
        background: rgba(2, 6, 23, 0.9);
        display: flex;
        justify-content: space-between;
        backdrop-filter: blur(10px);
      }

      .logout {
        background: linear-gradient(135deg, #ff4d4d, #ff0000);
        border: none;
        padding: 8px 12px;
        border-radius: 8px;
        color: white;
        cursor: pointer;
      }

      /* ===== MENSAJES ===== */
      .messages {
        flex: 1;
        padding: 20px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .msg {
        max-width: 65%;
        padding: 12px;
        border-radius: 15px;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
      }

      .asesor {
        align-self: flex-end;
        background: linear-gradient(135deg, #4a8df5, #00c6ff);
      }

      .cliente {
        align-self: flex-start;
        background: #334155;
      }

      .msg img {
        max-width: 220px;
        border-radius: 10px;
      }

      /* ===== INPUT ===== */
      .input-box {
        display: flex;
        gap: 10px;
        padding: 15px;
        background: #020617;
      }

      .input-box input {
        flex: 1;
        padding: 10px;
        border-radius: 10px;
        border: none;
      }

      /* ===== BOTONES ===== */
      .input-box button {
        background: linear-gradient(135deg, #4a8df5, #00c6ff);
        border: none;
        padding: 10px;
        border-radius: 10px;
        cursor: pointer;
      }

      /* ===== MENU ===== */
      #menuAdjuntos {
        display: none;
        position: absolute;
        bottom: 45px;
        background: #020617;
        border-radius: 10px;
        padding: 10px;
      }

      #menuAdjuntos button {
        display: block;
        width: 100%;
        background: none;
        border: none;
        color: white;
        padding: 8px;
        cursor: pointer;
      }

      /* ===== PROGRESS ===== */
      #progressBar {
        height: 5px;
        width: 0%;
        background: #00c6ff;
        transition: 0.2s;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <div class="sidebar">
        <h2>📂 Tickets</h2>
        <div id="tickets"></div>
      </div>

      <div class="chat">
        <div class="topbar">
          <span id="usuario"></span>
          <button class="logout" onclick="logout()">Salir</button>
        </div>

        <div id="progressBar"></div>
        <div class="messages" id="chat"></div>

        <div class="input-box">
          <div style="position: relative">
            <button onclick="toggleMenu()">📎</button>
            <div id="menuAdjuntos">
              <button onclick="seleccionarArchivo('pdf')">📄 PDF</button>
              <button onclick="seleccionarArchivo('img')">🖼️ Imagen</button>
            </div>
          </div>

          <input type="file" id="fileInput" hidden />

          <input id="mensaje" placeholder="Escribe mensaje..." />
          <button onclick="enviar()">➤</button>
        </div>
      </div>
    </div>

    <script>
      const socket = io("https://TU-APP.onrender.com", {
        transports: ["websocket"],
      });

      const usuario = JSON.parse(localStorage.getItem("usuario"));
      document.getElementById("usuario").textContent = usuario.email;

      let ticketActual = null;
      let tipoArchivo = null;

      /* ===== MENU ===== */
      function toggleMenu() {
        const m = document.getElementById("menuAdjuntos");
        m.style.display = m.style.display === "none" ? "block" : "none";
      }

      function seleccionarArchivo(tipo) {
        tipoArchivo = tipo;
        const input = document.getElementById("fileInput");
        input.accept = tipo === "pdf" ? ".pdf" : "image/*";
        input.click();
        document.getElementById("menuAdjuntos").style.display = "none";
      }

      /* ===== SUBIDA (FIX IMPORTANTE) ===== */
      async function subirArchivo(file) {
        const nombre = Date.now() + "_" + file.name;
        const storageRef = ref(storage, "tecnired/" + nombre);

        const uploadTask = uploadBytesResumable(storageRef, file);

        uploadTask.on(
          "state_changed",
          (snap) => {
            const progress = (snap.bytesTransferred / snap.totalBytes) * 100;
            document.getElementById("progressBar").style.width = progress + "%";
          },
          console.log,
          async () => {
            const url = await getDownloadURL(uploadTask.snapshot.ref);

            await fetch("/chat", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                ticket_id: ticketActual,
                remitente: usuario.email,
                mensaje: url,
              }),
            });

            // 🔥 MOSTRAR SIN RECARGAR
            agregarMensaje({
              ticket_id: ticketActual,
              remitente: usuario.email,
              mensaje: url,
            });

            document.getElementById("progressBar").style.width = "0%";
          },
        );
      }

      document.getElementById("fileInput").addEventListener("change", (e) => {
        const file = e.target.files[0];
        if (!file) return;

        if (tipoArchivo === "pdf" && file.type !== "application/pdf") {
          alert("Solo PDF");
          return;
        }

        if (tipoArchivo === "img" && !file.type.startsWith("image/")) {
          alert("Solo imágenes");
          return;
        }

        subirArchivo(file);
      });

      /* ===== MENSAJES ===== */
      function agregarMensaje(m) {
        const chat = document.getElementById("chat");
        const div = document.createElement("div");
        div.classList.add("msg");

        if (m.remitente === usuario.email) div.classList.add("asesor");
        else div.classList.add("cliente");

        const mensaje = m.mensaje.toLowerCase();

        if (mensaje.includes(".pdf")) {
          let url = m.mensaje;
          if (!url.includes("alt=media")) {
            url += url.includes("?") ? "&alt=media" : "?alt=media";
          }
          div.innerHTML = `<a href="${url}" target="_blank">📄 Ver PDF</a>`;
        } else if (mensaje.match(/\.(jpg|png|jpeg|gif|webp)/)) {
          div.innerHTML = `<img src="${m.mensaje}">`;
        } else {
          div.textContent = m.mensaje;
        }

        chat.appendChild(div);
        chat.scrollTop = chat.scrollHeight;
      }

      socket.on("nuevoMensaje", (m) => {
        if (m.ticket_id == ticketActual) agregarMensaje(m);
      });

      /* ===== RESTO ===== */
      function cargarTickets() {
        fetch(`/tickets/asesor/${usuario.email}`)
          .then((r) => r.json())
          .then((data) => {
            const cont = document.getElementById("tickets");
            cont.innerHTML = "";
            data.forEach((t) => {
              const div = document.createElement("div");
              div.className = "ticket";
              div.innerHTML = `#${t.id}<br>${t.categoria}`;
              div.onclick = () => {
                ticketActual = t.id;
                socket.emit("joinTicket", ticketActual);
                document.getElementById("chat").innerHTML = "";
              };
              cont.appendChild(div);
            });
          });
      }

      function enviar() {
        const input = document.getElementById("mensaje");
        if (!input.value || !ticketActual) return;

        fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            ticket_id: ticketActual,
            remitente: usuario.email,
            mensaje: input.value,
          }),
        });

        // 🔥 mostrar inmediato
        agregarMensaje({
          ticket_id: ticketActual,
          remitente: usuario.email,
          mensaje: input.value,
        });

        input.value = "";
      }

      function logout() {
        localStorage.removeItem("usuario");
        location.href = "/";
      }

      cargarTickets();
    </script>
  </body>
</html>
