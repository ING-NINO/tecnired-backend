<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Panel Asesor - TecniRed</title>

    <style>
      body {
        margin: 0;
        font-family: "Segoe UI", sans-serif;
        background: #0b1629;
        color: white;
      }

      /* NAV */
      .nav {
        background: rgba(11, 22, 41, 0.9);
        backdrop-filter: blur(10px);
        padding: 15px 25px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .nav span {
        color: #00c6ff;
      }

      /* CONTENEDOR */
      .container {
        display: flex;
        height: 90vh;
      }

      /* LISTA TICKETS */
      .tickets {
        width: 30%;
        background: #111c2f;
        overflow-y: auto;
        border-right: 1px solid rgba(255, 255, 255, 0.1);
      }

      .ticket {
        padding: 15px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        cursor: pointer;
        transition: 0.3s;
      }

      .ticket:hover {
        background: rgba(0, 198, 255, 0.2);
      }

      .ticket.active {
        background: rgba(0, 198, 255, 0.3);
      }

      /* CHAT */
      .chat {
        width: 70%;
        display: flex;
        flex-direction: column;
      }

      /* MENSAJES */
      .messages {
        flex: 1;
        padding: 20px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      /* BURBUJAS */
      .msg {
        max-width: 60%;
        padding: 12px 16px;
        border-radius: 15px;
        font-size: 14px;
        animation: fadeIn 0.3s ease;
      }

      /* CLIENTE */
      .user {
        align-self: flex-start;
        background: rgba(255, 255, 255, 0.1);
        color: #cbd5e1;
        border-bottom-left-radius: 5px;
      }

      /* ASESOR */
      .asesor {
        align-self: flex-end;
        background: linear-gradient(135deg, #4a8df5, #00c6ff);
        color: white;
        border-bottom-right-radius: 5px;
      }

      /* INPUT */
      .input {
        display: flex;
        gap: 10px;
        padding: 15px;
        background: #111c2f;
      }

      .input input {
        flex: 1;
        padding: 12px;
        border-radius: 10px;
        border: none;
        background: rgba(0, 0, 0, 0.5);
        color: white;
      }

      .input button {
        padding: 12px 20px;
        border-radius: 10px;
        border: none;
        background: linear-gradient(135deg, #4a8df5, #00c6ff);
        color: white;
        cursor: pointer;
        transition: 0.3s;
      }

      .input button:hover {
        transform: scale(1.05);
      }

      /* ANIMACION */
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>
  </head>

  <body>
    <div class="nav">
      <h3>Panel Asesor</h3>
      <span id="correo"></span>
    </div>

    <div class="container">
      <!-- LISTA -->
      <div class="tickets" id="tickets"></div>

      <!-- CHAT -->
      <div class="chat">
        <div class="messages" id="messages"></div>

        <div class="input">
          <input id="msg" placeholder="Escribe mensaje..." />
          <button onclick="enviar()">Enviar</button>
        </div>
      </div>
    </div>

    <script>
      const user = JSON.parse(localStorage.getItem("usuario"));
      if (!user) window.location.href = "/";

      document.getElementById("correo").innerText = user.email;

      let ticketActual = null;
      let ultimoMensajeId = 0;

      // ===== CARGAR TICKETS =====
      fetch(`/tickets/asesor/${user.email}`)
        .then((res) => res.json())
        .then((data) => {
          const cont = document.getElementById("tickets");

          data.forEach((t) => {
            const div = document.createElement("div");
            div.className = "ticket";
            div.innerHTML = `<b>${t.nombre}</b><br>${t.descripcion}`;

            div.onclick = () => {
              ticketActual = t.id;
              ultimoMensajeId = 0;

              document
                .querySelectorAll(".ticket")
                .forEach((el) => el.classList.remove("active"));
              div.classList.add("active");

              document.getElementById("messages").innerHTML = "";
              cargarMensajes();
            };

            cont.appendChild(div);
          });
        });

      // ===== MENSAJES =====
      function cargarMensajes() {
        if (!ticketActual) return;

        fetch(`/chat/${ticketActual}`)
          .then((res) => res.json())
          .then((data) => {
            const box = document.getElementById("messages");

            data.forEach((m) => {
              if (m.id <= ultimoMensajeId) return;

              const div = document.createElement("div");
              div.classList.add("msg");

              if (m.remitente === user.email) {
                div.classList.add("asesor");
              } else {
                div.classList.add("user");
              }

              div.innerText = m.mensaje;
              box.appendChild(div);

              ultimoMensajeId = m.id;
            });

            box.scrollTop = box.scrollHeight;
          });
      }

      // ===== ENVIAR =====
      function enviar() {
        const input = document.getElementById("msg");

        if (!input.value || !ticketActual) return;

        fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            ticket_id: ticketActual,
            remitente: user.email,
            mensaje: input.value,
          }),
        }).then(() => {
          input.value = "";
          cargarMensajes();
        });
      }

      // ENTER
      document.getElementById("msg").addEventListener("keypress", (e) => {
        if (e.key === "Enter") enviar();
      });

      // AUTO REFRESH
      setInterval(cargarMensajes, 1500);
    </script>
  </body>
</html>
