<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Panel Asesor | TecniRed</title>

    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
      rel="stylesheet"
    />

    <style>
      :root {
        --primary: #4a8df5;
        --secondary: #00c6ff;
        --dark: #0b1629;
      }

      body {
        margin: 0;
        font-family: "Segoe UI";
        background: var(--dark);
        color: white;
      }

      /* ===== LAYOUT ===== */
      .container {
        display: flex;
        height: 100vh;
      }

      /* ===== SIDEBAR ===== */
      .sidebar {
        width: 300px;
        background: #020617;
        padding: 20px;
        border-right: 1px solid #1e293b;
        overflow-y: auto;
      }

      .sidebar h2 {
        margin-bottom: 20px;
        color: var(--secondary);
      }

      .ticket {
        padding: 12px;
        border-radius: 12px;
        margin-bottom: 10px;
        cursor: pointer;
        background: #0f172a;
        transition: 0.3s;
      }

      .ticket:hover {
        background: #1e293b;
        transform: translateX(5px);
      }

      .ticket.active {
        background: linear-gradient(135deg, var(--primary), var(--secondary));
      }

      /* ===== CHAT ===== */
      .chat {
        flex: 1;
        display: flex;
        flex-direction: column;
      }

      .topbar {
        padding: 15px;
        background: #020617;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid #1e293b;
      }

      .messages {
        flex: 1;
        padding: 20px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      /* MENSAJES */
      .msg {
        max-width: 65%;
        padding: 12px 16px;
        border-radius: 15px;
        font-size: 14px;
        animation: fadeIn 0.3s ease;
      }

      .cliente {
        align-self: flex-start;
        background: #334155;
      }

      .asesor {
        align-self: flex-end;
        background: linear-gradient(135deg, var(--primary), var(--secondary));
      }

      /* INPUT */
      .input-box {
        display: flex;
        gap: 10px;
        padding: 15px;
        background: #020617;
        border-top: 1px solid #1e293b;
      }

      .input-box input {
        flex: 1;
        padding: 12px;
        border-radius: 10px;
        border: none;
        background: #0f172a;
        color: white;
      }

      .input-box button {
        padding: 12px 20px;
        border: none;
        border-radius: 10px;
        background: linear-gradient(135deg, var(--primary), var(--secondary));
        color: white;
        cursor: pointer;
      }

      .input-box button:hover {
        transform: scale(1.05);
      }

      /* ANIMACION */
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>
  </head>

  <body>
    <div class="container">
      <!-- ===== SIDEBAR ===== -->
      <div class="sidebar">
        <h2>📂 Tickets</h2>
        <div id="tickets"></div>
      </div>

      <!-- ===== CHAT ===== -->
      <div class="chat">
        <div class="topbar">
          <span id="usuario"></span>
          <button onclick="logout()">Salir</button>
        </div>

        <div class="messages" id="chat"></div>

        <div class="input-box">
          <input id="mensaje" placeholder="Escribe mensaje..." />
          <button onclick="enviar()">Enviar</button>
        </div>
      </div>
    </div>

    <script>
      const usuario = JSON.parse(localStorage.getItem("usuario"));
      if (!usuario) window.location.href = "/";

      document.getElementById("usuario").textContent = usuario.email;

      let ticketActual = null;
      let ultimoMensajeId = 0;

      /* ===== CARGAR TICKETS ===== */
      function cargarTickets() {
        fetch(`/tickets/asesor/${usuario.email}`)
          .then((res) => res.json())
          .then((data) => {
            const cont = document.getElementById("tickets");
            cont.innerHTML = "";

            data.forEach((t) => {
              const div = document.createElement("div");
              div.className = "ticket";
              div.innerHTML = `<b>#${t.id}</b><br>${t.categoria}`;

              div.onclick = () => {
                document
                  .querySelectorAll(".ticket")
                  .forEach((el) => el.classList.remove("active"));
                div.classList.add("active");

                ticketActual = t.id;
                ultimoMensajeId = 0;
                document.getElementById("chat").innerHTML = "";
                cargarMensajes(true);
              };

              cont.appendChild(div);
            });
          });
      }

      /* ===== CARGAR MENSAJES SIN PARPADEO ===== */
      function cargarMensajes(scroll = false) {
        if (!ticketActual) return;

        fetch(`/chat/${ticketActual}`)
          .then((res) => res.json())
          .then((data) => {
            const chat = document.getElementById("chat");

            data.forEach((m) => {
              if (m.id <= ultimoMensajeId) return;

              const div = document.createElement("div");
              div.classList.add("msg");

              if (m.remitente === usuario.email) {
                div.classList.add("asesor");
              } else {
                div.classList.add("cliente");
              }

              div.textContent = m.mensaje;
              chat.appendChild(div);

              ultimoMensajeId = m.id;
            });

            if (scroll) {
              chat.scrollTop = chat.scrollHeight;
            }
          });
      }

      /* ===== ENVIAR MENSAJE ===== */
      function enviar() {
        const input = document.getElementById("mensaje");

        if (!input.value || !ticketActual) return;

        fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            ticket_id: ticketActual,
            remitente: usuario.email,
            mensaje: input.value,
          }),
        }).then(() => {
          input.value = "";
          cargarMensajes(true);
        });
      }

      /* ENTER PARA ENVIAR */
      document.getElementById("mensaje").addEventListener("keypress", (e) => {
        if (e.key === "Enter") {
          enviar();
        }
      });

      /* AUTO REFRESH */
      setInterval(() => cargarMensajes(false), 1500);

      /* LOGOUT */
      function logout() {
        localStorage.removeItem("usuario");
        window.location.href = "/";
      }

      cargarTickets();
    </script>
  </body>
</html>
