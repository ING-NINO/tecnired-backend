<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Panel Asesor | TecniRed</title>

    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
      rel="stylesheet"
    />

    <style>
      :root {
        --primary: #4a8df5;
        --secondary: #00c6ff;
        --dark: #0b1629;
      }

      body {
        margin: 0;
        font-family: "Segoe UI";
        background: var(--dark);
        color: white;
      }

      /* ===== LAYOUT ===== */
      .container {
        display: flex;
        height: 100vh;
      }

      /* ===== SIDEBAR ===== */
      .sidebar {
        width: 300px;
        background: #020617;
        padding: 20px;
        border-right: 1px solid #1e293b;
        overflow-y: auto;
      }

      .ticket {
        padding: 12px;
        border-radius: 12px;
        margin-bottom: 10px;
        cursor: pointer;
        background: #0f172a;
        transition: 0.3s;
      }

      .ticket:hover {
        background: #1e293b;
        transform: translateX(5px);
      }

      .ticket.active {
        background: linear-gradient(135deg, var(--primary), var(--secondary));
      }

      /* ===== CHAT ===== */
      .chat {
        flex: 1;
        display: flex;
        flex-direction: column;
      }

      .topbar {
        padding: 15px;
        background: #020617;
        display: flex;
        justify-content: space-between;
        border-bottom: 1px solid #1e293b;
      }

      .messages {
        flex: 1;
        padding: 20px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      /* MENSAJES */
      .msg {
        max-width: 65%;
        padding: 12px 16px;
        border-radius: 15px;
        font-size: 14px;
        animation: fadeIn 0.3s ease;
      }

      .cliente {
        align-self: flex-start;
        background: #334155;
      }

      .asesor {
        align-self: flex-end;
        background: linear-gradient(135deg, var(--primary), var(--secondary));
      }

      .msg img {
        max-width: 200px;
        border-radius: 10px;
        margin-top: 5px;
      }

      /* INPUT */
      .input-box {
        display: flex;
        gap: 10px;
        padding: 15px;
        background: #020617;
        border-top: 1px solid #1e293b;
        align-items: center;
      }

      .input-box input[type="text"] {
        flex: 1;
        padding: 12px;
        border-radius: 10px;
        border: none;
        background: #0f172a;
        color: white;
      }

      .input-box button {
        padding: 12px;
        border: none;
        border-radius: 10px;
        background: linear-gradient(135deg, var(--primary), var(--secondary));
        color: white;
        cursor: pointer;
      }

      .file-btn {
        background: #1e293b;
      }

      .preview {
        position: absolute;
        bottom: 90px;
        left: 50%;
        transform: translateX(-50%);
        background: #020617;
        padding: 10px;
        border-radius: 10px;
        display: none;
      }

      .preview img {
        max-width: 150px;
      }

      /* ANIMACION */
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>
  </head>

  <body>
    <div class="container">
      <!-- SIDEBAR -->
      <div class="sidebar">
        <h2>📂 Tickets</h2>
        <div id="tickets"></div>
      </div>

      <!-- CHAT -->
      <div class="chat">
        <div class="topbar">
          <span id="usuario"></span>
          <button onclick="logout()">Salir</button>
        </div>

        <div class="messages" id="chat"></div>

        <!-- PREVIEW -->
        <div class="preview" id="previewBox">
          <img id="previewImg" />
        </div>

        <div class="input-box">
          <input type="file" id="fileInput" hidden />
          <button class="file-btn" onclick="abrirArchivo()">
            <i class="fa fa-paperclip"></i>
          </button>

          <input id="mensaje" placeholder="Escribe mensaje..." />

          <button onclick="enviar()">
            <i class="fa fa-paper-plane"></i>
          </button>
        </div>
      </div>
    </div>

    <script>
      const usuario = JSON.parse(localStorage.getItem("usuario"));
      if (!usuario) window.location.href = "/";

      document.getElementById("usuario").textContent = usuario.email;

      let ticketActual = null;
      let ultimoMensajeId = 0;

      /* ===== TICKETS ===== */
      function cargarTickets() {
        fetch(`/tickets/asesor/${usuario.email}`)
          .then((res) => res.json())
          .then((data) => {
            const cont = document.getElementById("tickets");
            cont.innerHTML = "";

            data.forEach((t) => {
              const div = document.createElement("div");
              div.className = "ticket";
              div.innerHTML = `<b>#${t.id}</b><br>${t.categoria}`;

              div.onclick = () => {
                document
                  .querySelectorAll(".ticket")
                  .forEach((el) => el.classList.remove("active"));
                div.classList.add("active");

                ticketActual = t.id;
                ultimoMensajeId = 0;
                document.getElementById("chat").innerHTML = "";
                cargarMensajes(true);
              };

              cont.appendChild(div);
            });
          });
      }

      /* ===== MENSAJES ===== */
      function cargarMensajes(scroll = false) {
        if (!ticketActual) return;

        fetch(`/chat/${ticketActual}`)
          .then((res) => res.json())
          .then((data) => {
            const chat = document.getElementById("chat");

            data.forEach((m) => {
              if (m.id <= ultimoMensajeId) return;

              const div = document.createElement("div");
              div.classList.add("msg");

              if (m.remitente === usuario.email) {
                div.classList.add("asesor");
              } else {
                div.classList.add("cliente");
              }

              // 🔥 ARCHIVO O TEXTO
             if (m.mensaje.startsWith("http")) {
                const img = document.createElement("img");
                img.src = m.mensaje;
                div.appendChild(img);
              } else {
                div.textContent = m.mensaje;
              }

              chat.appendChild(div);
              ultimoMensajeId = m.id;
            });

            if (scroll) chat.scrollTop = chat.scrollHeight;
          });
      }

      /* ===== MENSAJE TEXTO ===== */
      function enviar() {
        const input = document.getElementById("mensaje");

        if (!input.value || !ticketActual) return;

        fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            ticket_id: ticketActual,
            remitente: usuario.email,
            mensaje: input.value,
          }),
        }).then(() => {
          input.value = "";
          cargarMensajes(true);
        });
      }

      /* ===== ARCHIVOS ===== */
      function abrirArchivo() {
        document.getElementById("fileInput").click();
      }

      document.getElementById("fileInput").addEventListener("change", (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const preview = document.getElementById("previewBox");
        const img = document.getElementById("previewImg");

        img.src = URL.createObjectURL(file);
        preview.style.display = "block";

        enviarArchivo(file);
      });

      async function enviarArchivo(file) {
        const formData = new FormData();
        formData.append("archivo", file);
        formData.append("ticket_id", ticketActual);
        formData.append("remitente", usuario.email);

        await fetch("/chat/file", {
          method: "POST",
          body: formData,
        });

        document.getElementById("previewBox").style.display = "none";
        cargarMensajes(true);
      }

      /* ENTER */
      document.getElementById("mensaje").addEventListener("keypress", (e) => {
        if (e.key === "Enter") enviar();
      });

      /* AUTO REFRESH */
      setInterval(() => cargarMensajes(false), 1500);

      /* LOGOUT */
      function logout() {
        localStorage.removeItem("usuario");
        window.location.href = "/";
      }

      cargarTickets();
    </script>
  </body>
</html>
