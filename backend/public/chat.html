<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Chat - TecniRed</title>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <style>
      body {
        margin: 0;
        font-family: "Segoe UI";
        background: #0f172a;
        color: white;
      }

      /* CONTENEDOR */
      .chat-container {
        display: flex;
        height: 100vh;
      }

      /* SIDEBAR */
      .sidebar {
        width: 300px;
        background: #020617;
        padding: 20px;
        border-right: 1px solid #1e293b;
      }

      .sidebar h2 {
        margin-bottom: 20px;
      }

      .ticket {
        padding: 10px;
        border-radius: 10px;
        margin-bottom: 10px;
        cursor: pointer;
        background: #0f172a;
      }

      .ticket:hover {
        background: #1e293b;
      }

      /* CHAT */
      .chat {
        flex: 1;
        display: flex;
        flex-direction: column;
      }

      .messages {
        flex: 1;
        padding: 20px;
        overflow-y: auto;
      }

      .msg {
        margin-bottom: 10px;
        padding: 10px;
        border-radius: 10px;
        max-width: 60%;
      }

      .cliente {
        background: #2563eb;
        margin-left: auto;
      }

      .asesor {
        background: #334155;
      }

      .input-box {
        display: flex;
        padding: 10px;
        border-top: 1px solid #1e293b;
      }

      input {
        flex: 1;
        padding: 10px;
        border: none;
        border-radius: 10px;
      }

      button {
        margin-left: 10px;
        padding: 10px;
        border: none;
        border-radius: 10px;
        background: #3b82f6;
        color: white;
        cursor: pointer;
      }
    </style>
  </head>

  <body>
    <div class="chat-container">
      <!-- SIDEBAR -->
      <div class="sidebar">
        <h2>📂 Tickets</h2>
        <div id="tickets"></div>
      </div>

      <!-- CHAT -->
      <div class="chat">
        <div class="messages" id="chat"></div>

        <div class="input-box">
          <input id="mensaje" placeholder="Escribe mensaje..." />
          <button onclick="enviar()">Enviar</button>
        </div>
      </div>
    </div>

    <script>
      const usuario = JSON.parse(localStorage.getItem("usuario"));
      let ticketActual = null;

      /* ===== CARGAR TICKETS ===== */
      function cargarTickets() {
        fetch(`/tickets/asesor/${usuario.email}`)
          .then((res) => res.json())
          .then((data) => {
            const cont = document.getElementById("tickets");
            cont.innerHTML = "";

            data.forEach((t) => {
              const div = document.createElement("div");
              div.className = "ticket";
              div.innerHTML = `#${t.id} - ${t.categoria}`;
              div.onclick = () => abrirChat(t.id);
              cont.appendChild(div);
            });
          });
      }

      /* ===== ABRIR CHAT ===== */
      function abrirChat(id) {
        ticketActual = id;
        cargarMensajes();
      }

      /* ===== CARGAR MENSAJES ===== */
      function cargarMensajes() {
        if (!ticketActual) return;

        fetch(`/chat/${ticketActual}`)
          .then((res) => res.json())
          .then((data) => {
            const chat = document.getElementById("chat");
            chat.innerHTML = "";

            data.forEach((m) => {
              const div = document.createElement("div");
              div.className =
                "msg " + (m.remitente === usuario.email ? "cliente" : "asesor");

              div.textContent = m.mensaje;
              chat.appendChild(div);
            });

            chat.scrollTop = chat.scrollHeight;
          });
      }

      /* ===== ENVIAR MENSAJE ===== */
      function enviar() {
        const texto = document.getElementById("mensaje").value;

        fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            ticket_id: ticketActual,
            remitente: usuario.email,
            mensaje: texto,
          }),
        }).then(() => {
          document.getElementById("mensaje").value = "";
          cargarMensajes();
        });
      }

      /* ===== AUTO REFRESH ===== */
      setInterval(cargarMensajes, 2000);

      cargarTickets();
    </script>
  </body>
</html>
