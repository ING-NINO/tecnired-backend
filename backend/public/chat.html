<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Chat Soporte - TecniRed</title>

    <style>
      body {
        font-family: Arial;
        background: #0f172a;
        color: white;
        margin: 0;
      }

      .header {
        background: #1e293b;
        padding: 15px;
        text-align: center;
        font-size: 20px;
        font-weight: bold;
      }

      .chat-container {
        max-width: 600px;
        margin: 20px auto;
        background: #1e293b;
        border-radius: 10px;
        display: flex;
        flex-direction: column;
        height: 80vh;
      }

      .messages {
        flex: 1;
        padding: 15px;
        overflow-y: auto;
      }

      .message {
        margin: 10px 0;
        padding: 10px;
        border-radius: 10px;
        max-width: 70%;
      }

      .user {
        background: #3b82f6;
        align-self: flex-end;
      }

      .bot {
        background: #334155;
        align-self: flex-start;
      }

      .input-area {
        display: flex;
        border-top: 1px solid #334155;
      }

      input {
        flex: 1;
        padding: 10px;
        border: none;
        outline: none;
        background: #0f172a;
        color: white;
      }

      button {
        background: #3b82f6;
        border: none;
        padding: 10px 20px;
        color: white;
        cursor: pointer;
      }
    </style>
  </head>

  <body>
    <div class="header">💬 Soporte TecniRed</div>

    <div class="chat-container">
      <div class="messages" id="messages"></div>

      <div class="input-area">
        <input type="text" id="msg" placeholder="Escribe tu mensaje..." />
        <button onclick="sendMessage()">Enviar</button>
      </div>
    </div>

    <script>
      const API = "https://tecnired-backend.onrender.com";

      function addMessage(text, type) {
        const div = document.createElement("div");
        div.classList.add("message", type);
        div.innerText = text;
        document.getElementById("messages").appendChild(div);
      }

      async function sendMessage() {
        const input = document.getElementById("msg");
        const text = input.value;

        if (!text) return;

        addMessage(text, "user");

        input.value = "";

        try {
          const res = await fetch(API + "/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ mensaje: text }),
          });

          const data = await res.json();

          addMessage(data.respuesta || "Sin respuesta", "bot");
        } catch (error) {
          addMessage("Error conectando con el servidor", "bot");
        }
      }
    </script>
  </body>
</html>
