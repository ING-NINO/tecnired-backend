<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Panel Asesor | TecniRed</title>

    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
      rel="stylesheet"
    />
    
    <!-- Socket.IO -->
    <script src="/socket.io/socket.io.js"></script>

    <style>
      :root {
        --primary: #4a8df5;
        --secondary: #00c6ff;
        --dark: #0b1629;
      }

      body {
        margin: 0;
        font-family: "Segoe UI";
        background: var(--dark);
        color: white;
      }

      /* ===== LAYOUT ===== */
      .container {
        display: flex;
        height: 100vh;
      }

      /* ===== SIDEBAR ===== */
      .sidebar {
        width: 300px;
        background: #020617;
        padding: 20px;
        border-right: 1px solid #1e293b;
        overflow-y: auto;
      }

      .ticket {
        padding: 12px;
        border-radius: 12px;
        margin-bottom: 10px;
        cursor: pointer;
        background: #0f172a;
        transition: 0.3s;
      }

      .ticket:hover {
        background: #1e293b;
        transform: translateX(5px);
      }

      .ticket.active {
        background: linear-gradient(135deg, var(--primary), var(--secondary));
      }

      /* ===== CHAT ===== */
      .chat {
        flex: 1;
        display: flex;
        flex-direction: column;
      }

      .topbar {
        padding: 15px;
        background: #020617;
        display: flex;
        justify-content: space-between;
        border-bottom: 1px solid #1e293b;
      }

      .messages {
        flex: 1;
        padding: 20px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      /* MENSAJES */
      .msg {
        max-width: 65%;
        padding: 12px 16px;
        border-radius: 15px;
        font-size: 14px;
        animation: fadeIn 0.3s ease;
      }

      .cliente {
        align-self: flex-start;
        background: #334155;
      }

      .asesor {
        align-self: flex-end;
        background: linear-gradient(135deg, var(--primary), var(--secondary));
      }

      .msg img {
        max-width: 200px;
        border-radius: 10px;
        margin-top: 5px;
      }

      /* INPUT */
      .input-box {
        display: flex;
        gap: 10px;
        padding: 15px;
        background: #020617;
        border-top: 1px solid #1e293b;
        align-items: center;
      }

      .input-box input[type="text"] {
        flex: 1;
        padding: 12px;
        border-radius: 10px;
        border: none;
        background: #0f172a;
        color: white;
      }

      .input-box button {
        padding: 12px;
        border: none;
        border-radius: 10px;
        background: linear-gradient(135deg, var(--primary), var(--secondary));
        color: white;
        cursor: pointer;
        transition: all 0.3s;
      }
      
      .input-box button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      
      .input-box input[type="text"]:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      .file-btn {
        background: #1e293b;
      }
      
      /* Mensaje de ticket cerrado */
      .ticket-cerrado-msg {
        background: rgba(239, 68, 68, 0.2);
        border: 1px solid rgba(239, 68, 68, 0.5);
        color: #fca5a5;
        padding: 12px;
        border-radius: 10px;
        text-align: center;
        margin: 10px 20px;
        font-weight: 600;
      }

      .preview {
        position: absolute;
        bottom: 90px;
        left: 50%;
        transform: translateX(-50%);
        background: #020617;
        padding: 10px;
        border-radius: 10px;
        display: none;
      }

      .preview img {
        max-width: 150px;
      }

      /* ANIMACION */
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>
  </head>

  <body>
    <div class="container">
      <!-- SIDEBAR -->
      <div class="sidebar">
        <h2>📂 Tickets</h2>
        <div id="tickets"></div>
      </div>

      <!-- CHAT -->
      <div class="chat">
        <div class="topbar">
          <span id="usuario"></span>
          <button onclick="logout()">Salir</button>
        </div>

        <div class="messages" id="chat"></div>

        <!-- PREVIEW -->
        <div class="preview" id="previewBox">
          <img id="previewImg" />
        </div>

        <div class="input-box">
          <input type="file" id="fileInput" hidden />
          <button class="file-btn" onclick="abrirArchivo()">
            <i class="fa fa-paperclip"></i>
          </button>

          <input id="mensaje" placeholder="Escribe mensaje..." />

          <button onclick="enviar()">
            <i class="fa fa-paper-plane"></i>
          </button>
        </div>
      </div>
    </div>

    <script>
      const usuario = JSON.parse(localStorage.getItem("usuario"));
      if (!usuario) window.location.href = "/";

      document.getElementById("usuario").textContent = usuario.email;

      let ticketActual = null;
      let ultimoMensajeId = 0;
      let chatCerrado = false;
      let estadoTicketActual = null;
      
      // Socket.IO
      const socket = io();
      
      // Unirse a la sala del ticket cuando se selecciona
      function unirseATicket(ticketId) {
        socket.emit("joinTicket", ticketId);
      }
      
      // Escuchar cuando se finaliza un ticket
      socket.on("ticketFinalizado", (data) => {
        if (Number(data.ticket_id) === Number(ticketActual)) {
          bloquearChat("Este ticket ha sido finalizado. El chat está cerrado.");
          estadoTicketActual = "Finalizado";
        }
      });
      
      // Escuchar nuevos mensajes en tiempo real
      socket.on("nuevoMensaje", (m) => {
        if (Number(m.ticket_id) === Number(ticketActual) && m.id > ultimoMensajeId) {
          const chat = document.getElementById("chat");
          
          const div = document.createElement("div");
          div.classList.add("msg");

          if (m.remitente === usuario.email) {
            div.classList.add("asesor");
          } else {
            div.classList.add("cliente");
          }

          // ARCHIVO O TEXTO
          if (m.mensaje.startsWith("/uploads/") || m.mensaje.startsWith("http")) {
            const img = document.createElement("img");
            img.src = m.mensaje;
            div.appendChild(img);
          } else {
            div.textContent = m.mensaje;
          }

          chat.appendChild(div);
          ultimoMensajeId = m.id;
          chat.scrollTop = chat.scrollHeight;
        }
      });
      
      // Función para bloquear el chat
      function bloquearChat(mensaje) {
        chatCerrado = true;
        
        // Deshabilitar inputs
        document.getElementById("mensaje").disabled = true;
        document.getElementById("fileInput").disabled = true;
        document.querySelectorAll(".input-box button").forEach(btn => btn.disabled = true);
        
        // Mostrar mensaje
        const chat = document.getElementById("chat");
        const existeMensaje = document.querySelector(".ticket-cerrado-msg");
        if (!existeMensaje) {
          const div = document.createElement("div");
          div.className = "ticket-cerrado-msg";
          div.innerHTML = `<i class="fa fa-lock"></i> ${mensaje}`;
          chat.appendChild(div);
          chat.scrollTop = chat.scrollHeight;
        }
      }
      
      // Función para desbloquear el chat
      function desbloquearChat() {
        chatCerrado = false;
        
        // Habilitar inputs
        document.getElementById("mensaje").disabled = false;
        document.getElementById("fileInput").disabled = false;
        document.querySelectorAll(".input-box button").forEach(btn => btn.disabled = false);
        
        // Remover mensaje de cerrado
        const mensajeCerrado = document.querySelector(".ticket-cerrado-msg");
        if (mensajeCerrado) {
          mensajeCerrado.remove();
        }
      }

      /* ===== TICKETS ===== */
      function cargarTickets() {
        fetch(`/tickets/asesor/${usuario.email}`)
          .then((res) => res.json())
          .then((data) => {
            const cont = document.getElementById("tickets");
            cont.innerHTML = "";

            data.forEach((t) => {
              const div = document.createElement("div");
              div.className = "ticket";
              div.innerHTML = `<b>#${t.id}</b><br>${t.categoria}<br><small>${t.estado}</small>`;

              div.onclick = () => {
                document
                  .querySelectorAll(".ticket")
                  .forEach((el) => el.classList.remove("active"));
                div.classList.add("active");

                ticketActual = t.id;
                estadoTicketActual = t.estado;
                ultimoMensajeId = 0;
                document.getElementById("chat").innerHTML = "";
                
                // Desbloquear primero (por si el anterior estaba cerrado)
                desbloquearChat();
                
                // Unirse a la sala del ticket
                unirseATicket(t.id);
                
                // Verificar si está finalizado
                if (t.estado === "Finalizado") {
                  bloquearChat("Este ticket ya fue finalizado. El chat está cerrado.");
                }
                
                cargarMensajes(true);
              };

              cont.appendChild(div);
            });
          });
      }

      /* ===== MENSAJES ===== */
      function cargarMensajes(scroll = false) {
        if (!ticketActual) return;

        fetch(`/chat/${ticketActual}`)
          .then((res) => {
            if (res.status === 403) {
              bloquearChat("Este ticket ya fue finalizado. El chat está cerrado.");
              return null;
            }
            return res.json();
          })
          .then((data) => {
            if (!data) return;
            
            const chat = document.getElementById("chat");

            data.forEach((m) => {
              if (m.id <= ultimoMensajeId) return;

              const div = document.createElement("div");
              div.classList.add("msg");

              if (m.remitente === usuario.email) {
                div.classList.add("asesor");
              } else {
                div.classList.add("cliente");
              }

              // 🔥 ARCHIVO O TEXTO
              if (m.mensaje.startsWith("/uploads/")) {
                const img = document.createElement("img");
                img.src = m.mensaje;
                div.appendChild(img);
              } else {
                div.textContent = m.mensaje;
              }

              chat.appendChild(div);
              ultimoMensajeId = m.id;
            });

            if (scroll) chat.scrollTop = chat.scrollHeight;
          });
      }

      /* ===== MENSAJE TEXTO ===== */
      function enviar() {
        if (chatCerrado) return;
        
        const input = document.getElementById("mensaje");

        if (!input.value || !ticketActual) return;

        fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            ticket_id: ticketActual,
            remitente: usuario.email,
            mensaje: input.value,
          }),
        })
        .then((res) => {
          if (res.status === 403) {
            bloquearChat("Este ticket ya fue finalizado. El chat está cerrado.");
            return;
          }
          input.value = "";
          cargarMensajes(true);
        });
      }

      /* ===== ARCHIVOS ===== */
      function abrirArchivo() {
        if (chatCerrado) return;
        document.getElementById("fileInput").click();
      }

      document.getElementById("fileInput").addEventListener("change", (e) => {
        if (chatCerrado) return;
        
        const file = e.target.files[0];
        if (!file) return;

        const preview = document.getElementById("previewBox");
        const img = document.getElementById("previewImg");

        img.src = URL.createObjectURL(file);
        preview.style.display = "block";

        enviarArchivo(file);
      });

      async function enviarArchivo(file) {
        if (chatCerrado) return;
        
        const formData = new FormData();
        formData.append("archivo", file);
        formData.append("ticket_id", ticketActual);
        formData.append("remitente", usuario.email);

        const res = await fetch("/chat/file", {
          method: "POST",
          body: formData,
        });
        
        if (res.status === 403) {
          bloquearChat("Este ticket ya fue finalizado. El chat está cerrado.");
          return;
        }

        document.getElementById("previewBox").style.display = "none";
        cargarMensajes(true);
      }

      /* ENTER */
      document.getElementById("mensaje").addEventListener("keypress", (e) => {
        if (e.key === "Enter") enviar();
      });

      /* AUTO REFRESH (reducido porque ahora usamos Socket.IO) */
      setInterval(() => cargarMensajes(false), 10000); // Cada 10 segundos como backup

      /* LOGOUT */
      function logout() {
        localStorage.removeItem("usuario");
        window.location.href = "/";
      }

      cargarTickets();
    </script>
  </body>
</html>
