  </head>

  <body>
    <div class="chat-container">
      <header>
        <span id="usuario"></span>
        <button onclick="volver()">⬅ Volver</button>
      </header>

      ```
      <div id="mensajes" class="chat-box"></div>

      <!-- PREVIEW -->
      <div class="preview" id="previewBox">
        <img id="previewImg" />
      </div>

      <div class="chat-input">
        <input type="file" id="fileInput" hidden />
        <button class="file-btn" onclick="abrirArchivo()">📎</button>

        <input id="mensajeInput" placeholder="Escribe mensaje..." />
        <button onclick="enviarMensaje()">Enviar</button>
      </div>
    </div>

    <script>
      const usuario = JSON.parse(localStorage.getItem("usuario"));
      if (!usuario) window.location.href = "/";

      document.getElementById("usuario").textContent = usuario.nombre;

      const params = new URLSearchParams(window.location.search);
      const ticketId = params.get("ticket");

      let ultimoMensajeId = 0;

      // ===== CARGAR MENSAJES =====
      async function cargarMensajes() {
        const res = await fetch(`/chat/${ticketId}`);
        const data = await res.json();

        const contenedor = document.getElementById("mensajes");

        data.forEach((m) => {
          if (m.id <= ultimoMensajeId) return;

          const div = document.createElement("div");
          div.classList.add("mensaje");

          if (m.remitente === usuario.email) {
            div.classList.add("cliente");
          } else {
            div.classList.add("asesor");
          }

          // 🔥 TEXTO O IMAGEN
          if (m.mensaje.startsWith("http")) {
            const img = document.createElement("img");
            img.src = m.mensaje;
            div.appendChild(img);
          } else {
            div.textContent = m.mensaje;
          }

          contenedor.appendChild(div);
          ultimoMensajeId = m.id;
        });

        contenedor.scrollTop = contenedor.scrollHeight;
      }

      // ===== ENVIAR TEXTO =====
      async function enviarMensaje() {
        const input = document.getElementById("mensajeInput");

        if (!input.value) return;

        await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            ticket_id: ticketId,
            remitente: usuario.email,
            mensaje: input.value,
          }),
        });

        input.value = "";
        cargarMensajes();
      }

      // ===== ARCHIVOS =====
      function abrirArchivo() {
        document.getElementById("fileInput").click();
      }

      document.getElementById("fileInput").addEventListener("change", (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const preview = document.getElementById("previewBox");
        const img = document.getElementById("previewImg");

        img.src = URL.createObjectURL(file);
        preview.style.display = "block";

        enviarArchivo(file);
      });

      async function enviarArchivo(file) {
        const formData = new FormData();
        formData.append("archivo", file);
        formData.append("ticket_id", ticketId);
        formData.append("remitente", usuario.email);

        await fetch("/chat/file", {
          method: "POST",
          body: formData,
        });

        document.getElementById("previewBox").style.display = "none";
        cargarMensajes();
      }

      // ENTER
      document
        .getElementById("mensajeInput")
        .addEventListener("keypress", (e) => {
          if (e.key === "Enter") enviarMensaje();
        });

      function volver() {
        window.location.href = "/user_cliente.html";
      }

      setInterval(cargarMensajes, 1000);
      cargarMensajes();
    </script>
