<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Chat Cliente | TecniRed</title>

    <!-- SOCKET -->
    <script src="/socket.io/socket.io.js"></script>

    <style>
      body {
        margin: 0;
        font-family: "Segoe UI", sans-serif;
        background: #0b1629;
        color: white;
      }

      .chat-container {
        max-width: 900px;
        margin: 40px auto;
        background: rgba(11, 22, 41, 0.95);
        border-radius: 20px;
        padding: 20px;
        display: flex;
        flex-direction: column;
        height: 85vh;
      }

      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      header span {
        color: #00c6ff;
        font-weight: bold;
      }

      header button {
        background: red;
        border: none;
        padding: 8px 15px;
        border-radius: 8px;
        color: white;
        cursor: pointer;
      }

      .info-ticket {
        margin-top: 10px;
        color: #00c6ff;
        font-size: 14px;
      }

      .chat-box {
        flex: 1;
        overflow-y: auto;
        margin: 15px 0;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .mensaje {
        max-width: 65%;
        padding: 12px;
        border-radius: 15px;
      }

      .cliente {
        align-self: flex-end;
        background: linear-gradient(135deg, #4a8df5, #00c6ff);
      }

      .asesor {
        align-self: flex-start;
        background: #1e293b;
      }

      .mensaje img {
        max-width: 200px;
        border-radius: 10px;
        margin-top: 5px;
      }

      .mensaje a {
        color: #00c6ff;
        display: block;
        margin-top: 5px;
      }

      .chat-input {
        display: flex;
        gap: 10px;
      }

      .chat-input input {
        flex: 1;
        padding: 10px;
        border-radius: 10px;
        border: none;
        background: #1e293b;
        color: white;
      }

      .chat-input button {
        padding: 10px;
        border: none;
        border-radius: 10px;
        background: #00c6ff;
        color: white;
        cursor: pointer;
      }
    </style>
  </head>

  <body>
    <div class="chat-container">
      <header>
        <span id="usuario"></span>
        <button onclick="volver()">Volver</button>
      </header>

      <!-- INFO TICKET -->
      <div id="infoTicket" class="info-ticket"></div>

      <div id="mensajes" class="chat-box"></div>

      <div class="chat-input">
        <input type="file" id="fileInput" hidden />
        <button onclick="abrirArchivo()">📎</button>

        <input id="mensajeInput" placeholder="Escribe mensaje..." />
        <button onclick="enviarMensaje()">Enviar</button>
      </div>
    </div>

    <script>
      const socket = io();

      const usuario = JSON.parse(localStorage.getItem("usuario"));
      if (!usuario) window.location.href = "/";

      document.getElementById("usuario").textContent = usuario.nombre;

      const params = new URLSearchParams(window.location.search);
      const ticketId = params.get("ticket");

      // 🔥 UNIRSE AL TICKET (CLAVE)
      socket.emit("joinTicket", ticketId);

      // ===== MOSTRAR MENSAJE =====
      function agregarMensaje(m) {
        const contenedor = document.getElementById("mensajes");

        const div = document.createElement("div");
        div.classList.add("mensaje");

        if (m.remitente === usuario.email) {
          div.classList.add("cliente");
        } else {
          div.classList.add("asesor");
        }

        const mensaje = m.mensaje.toLowerCase();

        // 📄 PDF
        if (mensaje.endsWith(".pdf")) {
          const link = document.createElement("a");
          link.href = m.mensaje;
          link.target = "_blank";
          link.textContent = "📄 Ver PDF";
          div.appendChild(link);
        }

        // 🖼️ IMAGEN
        else if (mensaje.match(/\.(jpg|jpeg|png|gif|webp)$/)) {
          const img = document.createElement("img");
          img.src = m.mensaje;
          div.appendChild(img);
        }

        // 🔗 OTROS LINKS
        else if (mensaje.startsWith("http")) {
          const link = document.createElement("a");
          link.href = m.mensaje;
          link.target = "_blank";
          link.textContent = "📎 Abrir archivo";
          div.appendChild(link);
        }

        // 💬 TEXTO
        else {
          div.textContent = m.mensaje;
        }

        contenedor.appendChild(div);
        contenedor.scrollTop = contenedor.scrollHeight;
      }

      // ===== CARGAR MENSAJES =====
      async function cargarMensajes() {
        const res = await fetch(`/chat/${ticketId}`);
        const data = await res.json();

        document.getElementById("mensajes").innerHTML = "";

        data.forEach(agregarMensaje);
      }

      // ===== SOCKET TIEMPO REAL =====
      socket.on("nuevoMensaje", (m) => {
        if (m.ticket_id == ticketId) {
          agregarMensaje(m);
        }
      });

      // ===== ENVIAR MENSAJE =====
      async function enviarMensaje() {
        const input = document.getElementById("mensajeInput");

        if (!input.value) return;

        await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            ticket_id: ticketId,
            remitente: usuario.email,
            mensaje: input.value,
          }),
        });

        input.value = "";
      }

      // ===== ARCHIVOS =====
      function abrirArchivo() {
        document.getElementById("fileInput").click();
      }

      document
        .getElementById("fileInput")
        .addEventListener("change", async (e) => {
          const file = e.target.files[0];
          if (!file) return;

          const formData = new FormData();
          formData.append("archivo", file);
          formData.append("ticket_id", ticketId);
          formData.append("remitente", usuario.email);

          await fetch("/chat/file", {
            method: "POST",
            body: formData,
          });
        });

      function volver() {
        window.location.href = "/user_cliente.html";
      }

      cargarMensajes();
    </script>
  </body>
</html>
