<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Chat Cliente | TecniRed</title>

    <style>
      body {
        margin: 0;
        font-family: "Segoe UI", sans-serif;
        background: #0b1629;
        color: white;
      }

      .chat-container {
        max-width: 900px;
        margin: 40px auto;
        background: rgba(11, 22, 41, 0.95);
        border-radius: 20px;
        padding: 20px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        display: flex;
        flex-direction: column;
        height: 85vh;
      }

      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 10px;
      }

      header span {
        font-weight: bold;
        color: #00c6ff;
      }

      header button {
        background: #ff4d4d;
        border: none;
        padding: 8px 15px;
        border-radius: 8px;
        color: white;
        cursor: pointer;
      }

      header button:hover {
        background: #e03b3b;
      }

      .chat-box {
        flex: 1;
        overflow-y: auto;
        padding: 15px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .mensaje {
        max-width: 65%;
        padding: 12px 16px;
        border-radius: 15px;
        font-size: 14px;
        animation: fadeIn 0.3s ease;
      }

      .mensaje.cliente {
        align-self: flex-end;
        background: linear-gradient(135deg, #4a8df5, #00c6ff);
        color: white;
        border-bottom-right-radius: 5px;
      }

      .mensaje.asesor {
        align-self: flex-start;
        background: rgba(255, 255, 255, 0.1);
        color: #cbd5e1;
        border-bottom-left-radius: 5px;
      }

      .chat-input {
        display: flex;
        gap: 10px;
        margin-top: 10px;
      }

      .chat-input input {
        flex: 1;
        padding: 12px;
        border-radius: 10px;
        border: none;
        background: rgba(0, 0, 0, 0.5);
        color: white;
      }

      .chat-input button {
        background: linear-gradient(135deg, #4a8df5, #00c6ff);
        border: none;
        padding: 12px 20px;
        border-radius: 10px;
        color: white;
        cursor: pointer;
      }

      .chat-input button:hover {
        transform: scale(1.05);
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>
  </head>

  <body>
    <div class="chat-container">
      <header>
        <span id="usuario"></span>
        <button onclick="volver()">⬅ Volver</button>
      </header>

      <div id="mensajes" class="chat-box"></div>

      <div class="chat-input">
        <input id="mensajeInput" placeholder="Escribe mensaje..." />
        <button onclick="enviarMensaje()">Enviar</button>
      </div>
    </div>

    <script>
      const usuario = JSON.parse(localStorage.getItem("usuario"));
      if (!usuario) window.location.href = "/";

      document.getElementById("usuario").textContent = usuario.nombre;

      const params = new URLSearchParams(window.location.search);
      const ticketId = params.get("ticket");
      let ultimoMensajeId = 0;
      // ===== CARGAR MENSAJES =====
      async function cargarMensajes() {
        const res = await fetch(`/chat/${ticketId}`);
        const data = await res.json();

        const contenedor = document.getElementById("mensajes");

        data.forEach((m) => {
          // 🚫 Evitar duplicados
          if (m.id <= ultimoMensajeId) return;

          const div = document.createElement("div");
          div.classList.add("mensaje");

          if (m.remitente === usuario.email) {
            div.classList.add("cliente");
          } else {
            div.classList.add("asesor");
          }

          div.textContent = m.mensaje;

          contenedor.appendChild(div);

          ultimoMensajeId = m.id;
        });

        contenedor.scrollTop = contenedor.scrollHeight;
      }
      // ===== ENVIAR MENSAJE =====
      async function enviarMensaje() {
        const input = document.getElementById("mensajeInput");

        if (!input.value) return;

        await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            ticket_id: ticketId,
            remitente: usuario.email, // 🔥 IMPORTANTE
            mensaje: input.value,
          }),
        });

        input.value = "";
        cargarMensajes();
      }

      // ENTER PARA ENVIAR
      document
        .getElementById("mensajeInput")
        .addEventListener("keypress", function (e) {
          if (e.key === "Enter") {
            enviarMensaje();
          }
        });

      // ===== VOLVER =====
      function volver() {
        window.location.href = "/user_cliente.html";
      }

      // ===== AUTO REFRESH =====
      setInterval(cargarMensajes, 1000);

      cargarMensajes();
    </script>
  </body>
</html>
