<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Chat Cliente | TecniRed</title>

    <style>
      body {
        margin: 0;
        font-family: "Segoe UI", sans-serif;
        background: #0b1629;
        color: white;
      }

      .chat-container {
        max-width: 900px;
        margin: 40px auto;
        background: rgba(11, 22, 41, 0.95);
        border-radius: 20px;
        padding: 20px;
        display: flex;
        flex-direction: column;
        height: 85vh;
      }

      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      header span {
        color: #00c6ff;
        font-weight: bold;
      }

      header button {
        background: red;
        border: none;
        padding: 8px 15px;
        border-radius: 8px;
        color: white;
        cursor: pointer;
      }

      .chat-box {
        flex: 1;
        overflow-y: auto;
        margin: 15px 0;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .mensaje {
        max-width: 65%;
        padding: 12px;
        border-radius: 15px;
      }

      .cliente {
        align-self: flex-end;
        background: linear-gradient(135deg, #4a8df5, #00c6ff);
      }

      .asesor {
        align-self: flex-start;
        background: #1e293b;
      }

      .mensaje img {
        max-width: 200px;
        border-radius: 10px;
        margin-top: 5px;
      }

      .mensaje a {
        color: #00c6ff;
        display: block;
        margin-top: 5px;
      }

      .chat-input {
        display: flex;
        gap: 10px;
      }

      .chat-input input {
        flex: 1;
        padding: 10px;
        border-radius: 10px;
        border: none;
        background: #1e293b;
        color: white;
      }

      .chat-input button {
        padding: 10px;
        border: none;
        border-radius: 10px;
        background: #00c6ff;
        color: white;
        cursor: pointer;
      }
    </style>
  </head>

  <body>
    <div class="chat-container">
      <header>
        <span id="usuario"></span>
        <button onclick="volver()">Volver</button>
      </header>

      <div id="mensajes" class="chat-box"></div>

      <div class="chat-input">
        <input type="file" id="fileInput" hidden />
        <button onclick="abrirArchivo()">📎</button>

        <input id="mensajeInput" placeholder="Escribe mensaje..." />
        <button onclick="enviarMensaje()">Enviar</button>
      </div>
    </div>

    <script>
      const usuario = JSON.parse(localStorage.getItem("usuario"));
      if (!usuario) window.location.href = "/";

      document.getElementById("usuario").textContent = usuario.nombre;

      const params = new URLSearchParams(window.location.search);
      const ticketId = params.get("ticket");

      let ultimoMensajeId = 0;

      // ===== CARGAR MENSAJES =====
      async function cargarMensajes() {
        const res = await fetch(`/chat/${ticketId}`);
        const data = await res.json();

        const contenedor = document.getElementById("mensajes");

        data.forEach((m) => {
          if (m.id <= ultimoMensajeId) return;

          const div = document.createElement("div");
          div.classList.add("mensaje");

          if (m.remitente === usuario.email) {
            div.classList.add("cliente");
          } else {
            div.classList.add("asesor");
          }

          // 🔥 DETECTAR TIPO DE ARCHIVO
          if (m.mensaje.startsWith("http")) {
            // IMAGEN
            if (m.mensaje.match(/\.(jpg|jpeg|png|gif)$/i)) {
              const img = document.createElement("img");
              img.src = m.mensaje;
              div.appendChild(img);
            }
            // PDF u otro archivo
            else {
              const link = document.createElement("a");
              link.href = m.mensaje;
              link.target = "_blank";
              link.textContent = "📄 Ver archivo";
              div.appendChild(link);
            }
          } else {
            div.textContent = m.mensaje;
          }

          contenedor.appendChild(div);
          ultimoMensajeId = m.id;
        });

        contenedor.scrollTop = contenedor.scrollHeight;
      }

      // ===== ENVIAR TEXTO =====
      async function enviarMensaje() {
        const input = document.getElementById("mensajeInput");

        if (!input.value) return;

        await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            ticket_id: ticketId,
            remitente: usuario.email,
            mensaje: input.value,
          }),
        });

        input.value = "";
        cargarMensajes();
      }

      // ===== ARCHIVOS =====
      function abrirArchivo() {
        document.getElementById("fileInput").click();
      }

      document
        .getElementById("fileInput")
        .addEventListener("change", async (e) => {
          const file = e.target.files[0];
          if (!file) return;

          const formData = new FormData();
          formData.append("archivo", file);
          formData.append("ticket_id", ticketId);
          formData.append("remitente", usuario.email);

          await fetch("/chat/file", {
            method: "POST",
            body: formData,
          });

          cargarMensajes();
        });

      // ENTER
      document
        .getElementById("mensajeInput")
        .addEventListener("keypress", (e) => {
          if (e.key === "Enter") enviarMensaje();
        });

      function volver() {
        window.location.href = "/user_cliente.html";
      }

      setInterval(cargarMensajes, 1000);
      cargarMensajes();
    </script>
  </body>
</html>
