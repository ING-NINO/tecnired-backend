<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Chat Cliente | TecniRed</title>

    <script src="/socket.io/socket.io.js"></script>

    <!-- 🔥 FIREBASE -->
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
      import {
        getStorage,
        ref,
        uploadBytesResumable,
        getDownloadURL,
      } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";

      const firebaseConfig = {
        apiKey: "AIzaSyDkG2JyeF_mGwDx8dAL6BypVKLTzicSEe0",
        authDomain: "tecnired-221e0.firebaseapp.com",
        projectId: "tecnired-221e0",
        storageBucket: "tecnired-221e0.firebasestorage.app",
        appId: "1:247442670329:web:8a3215d5aeed054bd69828",
      };

      const app = initializeApp(firebaseConfig);
      window.storage = getStorage(app);
      window.ref = ref;
      window.uploadBytesResumable = uploadBytesResumable;
      window.getDownloadURL = getDownloadURL;
    </script>

    <style>
      :root {
        --bg: #020617;
        --panel: #0f172a;
        --line: #1e293b;
        --text: #e2e8f0;
        --muted: #94a3b8;
        --primary: #38bdf8;
        --primary-soft: #0ea5e9;
        --danger: #ef4444;
        --ok: #22c55e;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "Segoe UI", Arial, sans-serif;
        background: radial-gradient(circle at top, #0b1730 0%, var(--bg) 45%);
        color: var(--text);
        height: 100vh;
        overflow: hidden;
        scrollbar-color: #38bdf8 #0b1224;
        scrollbar-width: thin;
      }

      .chat-container {
        width: 100%;
        height: 100vh;
        display: grid;
        grid-template-rows: auto auto 1fr auto;
        min-height: 0;
      }

      header {
        padding: 14px 20px;
        border-bottom: 1px solid var(--line);
        background: rgba(2, 6, 23, 0.85);
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
      }

      header span {
        font-weight: 700;
      }

      .btn,
      header button,
      .chat-input button {
        border: none;
        border-radius: 10px;
        padding: 10px 12px;
        font-weight: 600;
        cursor: pointer;
      }

      header button {
        background: var(--danger);
        color: white;
      }

      .info-ticket {
        padding: 12px 20px;
        border-bottom: 1px solid var(--line);
        background: rgba(15, 23, 42, 0.72);
        color: var(--muted);
        font-size: 0.9rem;
      }

      .info-ticket strong {
        color: var(--text);
      }

      .chat-area {
        min-height: 0;
      }

      .chat-box {
        height: 100%;
        min-height: 0;
        padding: 18px;
        overflow-y: auto;
        background: linear-gradient(180deg, rgba(15, 23, 42, 0.65), #090f1f);
        display: flex;
        flex-direction: column;
        gap: 10px;
        scroll-behavior: smooth;
      }

      .chat-box::-webkit-scrollbar {
        width: 10px;
      }

      .chat-box::-webkit-scrollbar-track {
        background: #0b1224;
        border-radius: 999px;
      }

      .chat-box::-webkit-scrollbar-thumb {
        background: linear-gradient(180deg, #38bdf8, #0ea5e9);
        border-radius: 999px;
      }

      .chat-box::-webkit-scrollbar-thumb:hover {
        background: linear-gradient(180deg, #67e8f9, #38bdf8);
      }

      .mensaje {
        max-width: min(75%, 620px);
        padding: 12px;
        border-radius: 12px;
        line-height: 1.35;
        word-break: break-word;
      }

      .cliente {
        align-self: flex-end;
        background: linear-gradient(135deg, var(--primary-soft), var(--primary));
        color: #06202c;
      }

      .asesor {
        align-self: flex-start;
        background: #1e293b;
      }

      .mensaje img {
        max-width: min(100%, 360px);
        border-radius: 10px;
      }

      .chat-input {
        display: grid;
        grid-template-columns: auto 1fr auto;
        gap: 10px;
        padding: 14px;
        border-top: 1px solid var(--line);
        background: rgba(2, 6, 23, 0.9);
      }

      .chat-input input {
        width: 100%;
        min-width: 0;
        padding: 12px;
        border-radius: 10px;
        border: 1px solid var(--line);
        background: var(--panel);
        color: var(--text);
      }

      .chat-input input:disabled {
        opacity: 0.7;
        cursor: not-allowed;
      }

      .chat-input button {
        background: var(--ok);
        color: #04250f;
      }

      .chat-input > div > button {
        background: #1d4ed8;
        color: white;
      }

      .chat-input button:disabled {
        opacity: 0.55;
        cursor: not-allowed;
      }

      #menuAdjuntos {
        display: none;
        position: absolute;
        bottom: 50px;
        left: 0;
        min-width: 135px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 8px;
        z-index: 2;
      }

      #menuAdjuntos button {
        width: 100%;
        margin-bottom: 6px;
        background: #1d4ed8;
        color: white;
      }

      #menuAdjuntos button:last-child {
        margin-bottom: 0;
      }

      #progressBar {
        height: 6px;
        width: 0%;
        background: var(--primary);
      }

      .closed-notice {
        margin: auto;
        max-width: 520px;
        text-align: center;
        color: var(--muted);
      }
      
      /* Notificación de nuevo mensaje */
      .notification-toast {
        position: fixed;
        top: 80px;
        right: 20px;
        background: linear-gradient(135deg, var(--primary-soft), var(--primary));
        color: #06202c;
        padding: 16px 24px;
        border-radius: 12px;
        box-shadow: 0 8px 24px rgba(56, 189, 248, 0.4);
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 12px;
        z-index: 1000;
        animation: slideIn 0.3s ease, slideOut 0.3s ease 2.7s;
        pointer-events: none;
      }
      
      .notification-toast i {
        font-size: 1.2rem;
      }
      
      @keyframes slideIn {
        from {
          transform: translateX(400px);
          opacity: 0;
        }
        to {
          transform: translateX(0);
          opacity: 1;
        }
      }
      
      @keyframes slideOut {
        from {
          transform: translateX(0);
          opacity: 1;
        }
        to {
          transform: translateX(400px);
          opacity: 0;
        }
      }

      @media (max-width: 640px) {
        header {
          align-items: flex-start;
          flex-direction: column;
        }

        .chat-input {
          grid-template-columns: auto 1fr;
        }

        .chat-input > button {
          grid-column: 1 / -1;
        }
        
        .notification-toast {
          right: 10px;
          left: 10px;
          top: 70px;
        }
      }
    </style>
  </head>

  <body>
    <div class="chat-container">
      <header>
        <span id="usuario"></span>
        <button onclick="volver()">Volver</button>
      </header>

      <div id="infoTicket" class="info-ticket"></div>

      <div id="progressBar"></div>

      <div class="chat-area">
        <div id="mensajes" class="chat-box"></div>
      </div>

      <div class="chat-input">
        <div style="position: relative">
          <button id="btnAdjuntar" onclick="toggleMenu()">Archivo</button>

          <div id="menuAdjuntos">
            <button onclick="seleccionarArchivo('pdf')">PDF</button>
            <button onclick="seleccionarArchivo('img')">Imagen</button>
          </div>
        </div>

        <input type="file" id="fileInput" hidden />

        <input id="mensajeInput" placeholder="Escribe mensaje..." />
        <button id="btnEnviar" onclick="enviarMensaje()">Enviar</button>
      </div>
    </div>

    <script>
      const socket = io();

      const usuario = JSON.parse(localStorage.getItem("usuario"));
      if (!usuario) window.location.href = "/";

      document.getElementById("usuario").textContent = usuario.nombre;

      const params = new URLSearchParams(window.location.search);
      const ticketId = params.get("ticket");
      if (!ticketId) window.location.href = "/user_cliente.html";

      let tipoArchivo = null;
      let chatCerrado = false;
      const contenedorMensajes = document.getElementById("mensajes");
      const mensajeInput = document.getElementById("mensajeInput");
      const btnAdjuntar = document.getElementById("btnAdjuntar");
      const btnEnviar = document.getElementById("btnEnviar");
      const infoTicket = document.getElementById("infoTicket");

      function bloquearChat(mensaje = "Este caso ya fue finalizado.") {
        chatCerrado = true;
        mensajeInput.disabled = true;
        btnAdjuntar.disabled = true;
        btnEnviar.disabled = true;
        mensajeInput.placeholder = "Chat finalizado";
        document.getElementById("menuAdjuntos").style.display = "none";
        contenedorMensajes.innerHTML = `<div class="closed-notice">${mensaje}</div>`;
      }

      async function cargarTicket() {
        const res = await fetch(`/tickets/detalle/${ticketId}`);

        if (!res.ok) {
          bloquearChat("No se pudo abrir este ticket.");
          return false;
        }

        const ticket = await res.json();

        if (ticket.email && ticket.email !== usuario.email) {
          bloquearChat("Este ticket no pertenece a tu cuenta.");
          return false;
        }

        infoTicket.innerHTML = `
          <strong>Ticket #${ticket.id}</strong> · ${ticket.categoria || "Sin categoría"} ·
          Estado: ${ticket.estado || "Nuevo"}
        `;

        if (ticket.estado === "Finalizado") {
          bloquearChat("Este caso ya fue finalizado. El chat está cerrado.");
          return false;
        }

        socket.emit("joinTicket", ticketId);
        return true;
      }

      function estaCercaDelFinal() {
        const gap =
          contenedorMensajes.scrollHeight -
          contenedorMensajes.scrollTop -
          contenedorMensajes.clientHeight;
        return gap < 32;
      }

      function actualizarBotonBajar() {
        // función reservada para mantener la lógica de scroll actual
        // sin mostrar flechas flotantes.
        estaCercaDelFinal();
      }

      function irAbajo() {
        contenedorMensajes.scrollTo({
          top: contenedorMensajes.scrollHeight,
          behavior: "smooth",
        });
      }

      /* MENU */
      function toggleMenu() {
        if (chatCerrado) return;
        const m = document.getElementById("menuAdjuntos");
        m.style.display = m.style.display === "none" ? "block" : "none";
      }

      function seleccionarArchivo(tipo) {
        if (chatCerrado) return;
        tipoArchivo = tipo;
        const input = document.getElementById("fileInput");
        input.accept = tipo === "pdf" ? ".pdf" : "image/*";
        input.click();
        document.getElementById("menuAdjuntos").style.display = "none";
      }

      /* HISTORIAL */
      async function cargarMensajes() {
        const res = await fetch(`/chat/${ticketId}`);
        if (res.status === 403) {
          bloquearChat("Este caso ya fue finalizado. El chat está cerrado.");
          return;
        }
        const data = await res.json();

        contenedorMensajes.innerHTML = "";

        data.forEach(agregarMensaje);
        irAbajo();
        actualizarBotonBajar();
      }

      /* AGREGAR MENSAJE */
      function agregarMensaje(m) {
        const contenedor = contenedorMensajes;
        const div = document.createElement("div");
        const cerca = estaCercaDelFinal();

        div.classList.add("mensaje");
        div.classList.add(m.remitente === usuario.email ? "cliente" : "asesor");

        const mensaje = m.mensaje.toLowerCase();

        if (mensaje.includes(".pdf")) {
          div.innerHTML = `<a href="${m.mensaje}" target="_blank">📄 Ver PDF</a>`;
        } else if (mensaje.match(/\.(jpg|png|jpeg|gif|webp)/)) {
          div.innerHTML = `<img src="${m.mensaje}">`;
        } else {
          div.textContent = m.mensaje;
        }

        contenedor.appendChild(div);
        if (cerca || m.remitente === usuario.email) {
          contenedor.scrollTop = contenedor.scrollHeight;
        }
        actualizarBotonBajar();
      }

      /* SOCKET */
      socket.on("nuevoMensaje", (m) => {
        if (m.ticket_id == ticketId) {
          agregarMensaje(m);
          
          // Notificar si el mensaje es del asesor (no del cliente mismo)
          if (m.remitente !== usuario.email) {
            mostrarNotificacion("Nuevo mensaje del asesor");
            
            // Reproducir sonido de notificación (opcional)
            reproducirSonido();
          }
        }
      });
      
      // Función para mostrar notificación
      function mostrarNotificacion(mensaje) {
        // Remover notificación anterior si existe
        const notifAnterior = document.querySelector(".notification-toast");
        if (notifAnterior) {
          notifAnterior.remove();
        }
        
        // Crear nueva notificación
        const notif = document.createElement("div");
        notif.className = "notification-toast";
        notif.innerHTML = `
          <i class="fa-solid fa-message"></i>
          <span>${mensaje}</span>
        `;
        
        document.body.appendChild(notif);
        
        // Remover después de 3 segundos
        setTimeout(() => {
          notif.remove();
        }, 3000);
      }
      
      // Función para reproducir sonido de notificación
      function reproducirSonido() {
        try {
          // Crear un beep simple usando Web Audio API
          const audioContext = new (window.AudioContext || window.webkitAudioContext)();
          const oscillator = audioContext.createOscillator();
          const gainNode = audioContext.createGain();
          
          oscillator.connect(gainNode);
          gainNode.connect(audioContext.destination);
          
          oscillator.frequency.value = 800; // Frecuencia del beep
          oscillator.type = 'sine';
          
          gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
          gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.2);
          
          oscillator.start(audioContext.currentTime);
          oscillator.stop(audioContext.currentTime + 0.2);
        } catch (e) {
          console.log("No se pudo reproducir sonido:", e);
        }
      }

      socket.on("ticketFinalizado", (data) => {
        if (Number(data.ticket_id) === Number(ticketId)) {
          infoTicket.innerHTML += " · Estado: Finalizado";
          bloquearChat("Este caso acaba de ser finalizado. El chat está cerrado.");
        }
      });

      /* ENVIAR TEXTO */
      async function enviarMensaje() {
        if (chatCerrado) return;
        const input = mensajeInput;
        if (!input.value.trim()) return;

        const res = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            ticket_id: ticketId,
            remitente: usuario.email,
            mensaje: input.value,
          }),
        });

        if (res.status === 403) {
          bloquearChat("Este caso ya fue finalizado. El chat está cerrado.");
          return;
        }

        // ❌ NO agregar manualmente - llegará por Socket.IO
        // agregarMensaje({ ... });

        input.value = "";
      }

      /* SUBIR ARCHIVO */
      async function subirArchivo(file) {
        if (chatCerrado) return;
        const nombre = Date.now() + "_" + file.name;
        const storageRef = ref(storage, "tecnired/" + nombre);

        const uploadTask = uploadBytesResumable(storageRef, file);

        uploadTask.on(
          "state_changed",
          (snap) => {
            const progress = (snap.bytesTransferred / snap.totalBytes) * 100;
            document.getElementById("progressBar").style.width = progress + "%";
          },
          console.log,
          async () => {
            const url = await getDownloadURL(uploadTask.snapshot.ref);

            const res = await fetch("/chat", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                ticket_id: ticketId,
                remitente: usuario.email,
                mensaje: url,
              }),
            });

            if (res.status === 403) {
              bloquearChat("Este caso ya fue finalizado. El chat está cerrado.");
              return;
            }

            // ❌ NO agregar manualmente - llegará por Socket.IO
            // agregarMensaje({ ... });

            document.getElementById("progressBar").style.width = "0%";
          },
        );
      }

      document.getElementById("fileInput").addEventListener("change", (e) => {
        const file = e.target.files[0];
        if (!file) return;

        subirArchivo(file);
      });
      contenedorMensajes.addEventListener("scroll", actualizarBotonBajar);

      function volver() {
        window.location.href = "/user_cliente.html";
      }

      cargarTicket().then((puedeAbrir) => {
        if (puedeAbrir) cargarMensajes();
      });
    </script>
  </body>
</html>
