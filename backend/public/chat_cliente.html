<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Chat Cliente | TecniRed</title>

    <script src="/socket.io/socket.io.js"></script>

    <!-- 🔥 FIREBASE -->
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
      import {
        getStorage,
        ref,
        uploadBytesResumable,
        getDownloadURL,
      } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";

      const firebaseConfig = {
        apiKey: "AIzaSyDkG2JyeF_mGwDx8dAL6BypVKLTzicSEe0",
        authDomain: "tecnired-221e0.firebaseapp.com",
        projectId: "tecnired-221e0",
        storageBucket: "tecnired-221e0.firebasestorage.app",
        appId: "1:247442670329:web:8a3215d5aeed054bd69828",
      };

      const app = initializeApp(firebaseConfig);
      window.storage = getStorage(app);
      window.ref = ref;
      window.uploadBytesResumable = uploadBytesResumable;
      window.getDownloadURL = getDownloadURL;
    </script>

    <style>
      body {
        margin: 0;
        font-family: "Segoe UI", sans-serif;
        background: #f1f5f9;
        color: #1e293b;
        height: 100vh;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        scrollbar-color: #0ea5e9 #dbeafe;
        scrollbar-width: thin;
      }

      .chat-container {
        max-width: 900px;
        width: min(900px, 96vw);
        background: white;
        border-radius: 15px;
        display: flex;
        flex-direction: column;
        height: min(92vh, 900px);
        border: 1px solid #e2e8f0;
        min-height: 0;
      }

      /* HEADER */
      header {
        display: flex;
        justify-content: space-between;
        padding: 15px;
        border-bottom: 1px solid #e2e8f0;
      }

      header span {
        font-weight: bold;
      }

      header button {
        background: #ef4444;
        color: white;
        border: none;
        padding: 8px 12px;
        border-radius: 8px;
        cursor: pointer;
      }

      /* INFO */
      .info-ticket {
        padding: 10px 15px;
        font-size: 14px;
        color: #64748b;
      }

      /* CHAT */
      .chat-box {
        flex: 1;
        padding: 15px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .chat-area {
        flex: 1;
        min-height: 0;
      }

      .chat-box::-webkit-scrollbar {
        width: 10px;
      }

      .chat-box::-webkit-scrollbar-track {
        background: #e2e8f0;
        border-radius: 999px;
      }

      .chat-box::-webkit-scrollbar-thumb {
        background: linear-gradient(180deg, #38bdf8, #0ea5e9);
        border-radius: 999px;
      }

      .chat-box::-webkit-scrollbar-thumb:hover {
        background: linear-gradient(180deg, #7dd3fc, #38bdf8);
      }

      /* MENSAJES */
      .mensaje {
        max-width: 65%;
        padding: 10px;
        border-radius: 12px;
      }

      .cliente {
        align-self: flex-end;
        background: #0ea5e9;
        color: white;
      }

      .asesor {
        align-self: flex-start;
        background: #e2e8f0;
      }

      .mensaje img {
        max-width: 220px;
        border-radius: 10px;
      }

      /* INPUT */
      .chat-input {
        display: flex;
        gap: 10px;
        padding: 15px;
        border-top: 1px solid #e2e8f0;
      }

      /* INPUT TEXT */
      .chat-input input {
        flex: 1;
        padding: 10px;
        border-radius: 10px;
        border: 1px solid #cbd5e1;
      }

      /* BOTONES */
      .chat-input button {
        background: #0ea5e9;
        color: white;
        border: none;
        padding: 10px;
        border-radius: 10px;
        cursor: pointer;
      }

      /* MENU */
      #menuAdjuntos {
        display: none;
        position: absolute;
        bottom: 50px;
        background: white;
        border: 1px solid #e2e8f0;
        border-radius: 10px;
        padding: 10px;
      }

      /* PROGRESS */
      #progressBar {
        height: 4px;
        width: 0%;
        background: #0ea5e9;
      }
    </style>
  </head>

  <body>
    <div class="chat-container">
      <header>
        <span id="usuario"></span>
        <button onclick="volver()">⬅ Volver</button>
      </header>

      <div id="infoTicket" class="info-ticket"></div>

      <div id="progressBar"></div>

      <div class="chat-area">
        <div id="mensajes" class="chat-box"></div>
      </div>

      <div class="chat-input">
        <div style="position: relative">
          <button onclick="toggleMenu()">📎</button>

          <div id="menuAdjuntos">
            <button onclick="seleccionarArchivo('pdf')">📄 PDF</button>
            <button onclick="seleccionarArchivo('img')">🖼️ Imagen</button>
          </div>
        </div>

        <input type="file" id="fileInput" hidden />

        <input id="mensajeInput" placeholder="Escribe mensaje..." />
        <button onclick="enviarMensaje()">Enviar</button>
      </div>
    </div>

    <script>
      const socket = io();

      const usuario = JSON.parse(localStorage.getItem("usuario"));
      document.getElementById("usuario").textContent = usuario.nombre;

      const params = new URLSearchParams(window.location.search);
      const ticketId = params.get("ticket");

      socket.emit("joinTicket", ticketId);

      document.getElementById("infoTicket").innerHTML =
        `🎫 Ticket #${ticketId}`;

      let tipoArchivo = null;
      const contenedorMensajes = document.getElementById("mensajes");

      function estaCercaDelFinal() {
        const gap =
          contenedorMensajes.scrollHeight -
          contenedorMensajes.scrollTop -
          contenedorMensajes.clientHeight;
        return gap < 32;
      }

      function actualizarBotonBajar() {
        // función reservada para mantener la lógica de scroll actual
        // sin mostrar flechas flotantes.
        estaCercaDelFinal();
      }

      function irAbajo() {
        contenedorMensajes.scrollTo({
          top: contenedorMensajes.scrollHeight,
          behavior: "smooth",
        });
      }

      /* MENU */
      function toggleMenu() {
        const m = document.getElementById("menuAdjuntos");
        m.style.display = m.style.display === "none" ? "block" : "none";
      }

      function seleccionarArchivo(tipo) {
        tipoArchivo = tipo;
        const input = document.getElementById("fileInput");
        input.accept = tipo === "pdf" ? ".pdf" : "image/*";
        input.click();
        document.getElementById("menuAdjuntos").style.display = "none";
      }

      /* HISTORIAL */
      async function cargarMensajes() {
        const res = await fetch(`/chat/${ticketId}`);
        const data = await res.json();

        contenedorMensajes.innerHTML = "";

        data.forEach(agregarMensaje);
        irAbajo();
        actualizarBotonBajar();
      }

      /* AGREGAR MENSAJE */
      function agregarMensaje(m) {
        const contenedor = contenedorMensajes;
        const div = document.createElement("div");
        const cerca = estaCercaDelFinal();

        div.classList.add("mensaje");
        div.classList.add(m.remitente === usuario.email ? "cliente" : "asesor");

        const mensaje = m.mensaje.toLowerCase();

        if (mensaje.includes(".pdf")) {
          div.innerHTML = `<a href="${m.mensaje}" target="_blank">📄 Ver PDF</a>`;
        } else if (mensaje.match(/\.(jpg|png|jpeg|gif|webp)/)) {
          div.innerHTML = `<img src="${m.mensaje}">`;
        } else {
          div.textContent = m.mensaje;
        }

        contenedor.appendChild(div);
        if (cerca || m.remitente === usuario.email) {
          contenedor.scrollTop = contenedor.scrollHeight;
        }
        actualizarBotonBajar();
      }

      /* SOCKET */
      socket.on("nuevoMensaje", (m) => {
        if (m.ticket_id == ticketId) {
          agregarMensaje(m);
        }
      });

      /* ENVIAR TEXTO */
      async function enviarMensaje() {
        const input = document.getElementById("mensajeInput");
        if (!input.value.trim()) return;

        await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            ticket_id: ticketId,
            remitente: usuario.email,
            mensaje: input.value,
          }),
        });

        agregarMensaje({
          ticket_id: ticketId,
          remitente: usuario.email,
          mensaje: input.value,
        });

        input.value = "";
      }

      /* SUBIR ARCHIVO */
      async function subirArchivo(file) {
        const nombre = Date.now() + "_" + file.name;
        const storageRef = ref(storage, "tecnired/" + nombre);

        const uploadTask = uploadBytesResumable(storageRef, file);

        uploadTask.on(
          "state_changed",
          (snap) => {
            const progress = (snap.bytesTransferred / snap.totalBytes) * 100;
            document.getElementById("progressBar").style.width = progress + "%";
          },
          console.log,
          async () => {
            const url = await getDownloadURL(uploadTask.snapshot.ref);

            await fetch("/chat", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                ticket_id: ticketId,
                remitente: usuario.email,
                mensaje: url,
              }),
            });

            agregarMensaje({
              ticket_id: ticketId,
              remitente: usuario.email,
              mensaje: url,
            });

            document.getElementById("progressBar").style.width = "0%";
          },
        );
      }

      document.getElementById("fileInput").addEventListener("change", (e) => {
        const file = e.target.files[0];
        if (!file) return;

        subirArchivo(file);
      });
      contenedorMensajes.addEventListener("scroll", actualizarBotonBajar);

      function volver() {
        window.location.href = "/user_cliente.html";
      }

      cargarMensajes();
    </script>
  </body>
</html>
