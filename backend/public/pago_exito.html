<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pago Exitoso - TecniRed</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: white;
      border-radius: 20px;
      padding: 50px 40px;
      max-width: 500px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    .icon {
      width: 80px;
      height: 80px;
      background: linear-gradient(135deg, #4caf50, #66bb6a);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 30px;
      font-size: 40px;
      color: white;
      animation: bounce 0.6s ease;
    }
    @keyframes bounce {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }
    h1 {
      color: #333;
      font-size: 2rem;
      margin-bottom: 15px;
    }
    p {
      color: #666;
      font-size: 1.1rem;
      line-height: 1.6;
      margin-bottom: 30px;
    }
    .btn {
      display: inline-block;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      padding: 15px 40px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: bold;
      font-size: 1.1rem;
      transition: all 0.3s ease;
    }
    .btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
    }
    .loading {
      color: #666;
      font-size: 0.9rem;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">✓</div>
    <h1>¡Pago Exitoso!</h1>
    <p id="mensaje">Tu plan ha sido activado correctamente. Actualizando tus privilegios...</p>
    <a href="/user_cliente.html" class="btn" id="btnPanel">Ir al Panel</a>
    <p class="loading" id="loading">Espera un momento...</p>
  </div>

  <script>
    // Actualizar el plan del usuario en localStorage
    async function actualizarPlan() {
      try {
        // Obtener usuario actual
        const usuario = JSON.parse(localStorage.getItem("usuario") || "null");
        
        if (!usuario || !usuario.email) {
          document.getElementById("mensaje").textContent = 
            "Por favor, inicia sesión para ver tus nuevos privilegios.";
          document.getElementById("loading").style.display = "none";
          return;
        }

        // Esperar 3 segundos para que el webhook procese el pago
        await new Promise(resolve => setTimeout(resolve, 3000));

        // Obtener el plan actualizado
        const res = await fetch(`/usuario/plan/${usuario.email}`);
        const data = await res.json();

        if (data.plan && data.plan !== "gratis") {
          // Actualizar localStorage con el nuevo plan
          usuario.plan = data.plan;
          localStorage.setItem("usuario", JSON.stringify(usuario));
          
          document.getElementById("mensaje").textContent = 
            `¡Felicidades! Tu plan ${data.plan.toUpperCase()} está activo. Ya puedes disfrutar de todas las funcionalidades.`;
          document.getElementById("loading").style.display = "none";
        } else {
          // Si aún no se actualizó, esperar más tiempo
          setTimeout(async () => {
            const res2 = await fetch(`/usuario/plan/${usuario.email}`);
            const data2 = await res2.json();
            
            if (data2.plan && data2.plan !== "gratis") {
              usuario.plan = data2.plan;
              localStorage.setItem("usuario", JSON.stringify(usuario));
            }
            
            document.getElementById("loading").style.display = "none";
          }, 3000);
        }
      } catch (err) {
        console.error("Error actualizando plan:", err);
        document.getElementById("loading").textContent = 
          "Hubo un problema al actualizar. Recarga la página en tu panel.";
      }
    }

    // Ejecutar al cargar
    actualizarPlan();
  </script>
</body>
</html>
