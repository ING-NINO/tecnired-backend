<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Pago exitoso | TecniRed</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:"Inter",sans-serif;}
    body{background:#020617;color:#e2e8f0;min-height:100vh;display:grid;place-items:center;}
    .card{background:rgba(15,23,42,0.9);border:1px solid rgba(34,197,94,0.3);border-radius:24px;padding:52px 44px;max-width:480px;width:90%;text-align:center;box-shadow:0 30px 80px rgba(0,0,0,0.5);}
    .icon{width:72px;height:72px;border-radius:50%;background:rgba(34,197,94,0.15);border:2px solid rgba(34,197,94,0.4);display:grid;place-items:center;margin:0 auto 24px;font-size:1.8rem;color:#22c55e;}
    h1{font-size:1.6rem;font-weight:800;margin-bottom:12px;}
    p{color:#94a3b8;line-height:1.7;margin-bottom:28px;}
    .btn{display:inline-flex;align-items:center;gap:8px;background:linear-gradient(135deg,#0ea5e9,#38bdf8);color:#06202c;padding:13px 28px;border-radius:12px;text-decoration:none;font-weight:700;transition:all 0.3s;}
    .btn:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(56,189,248,0.4);}
    .payment-id{margin-top:20px;font-size:0.75rem;color:#475569;}
  </style>
</head>
<body>
  <div class="card">
    <div class="icon"><i class="fa-solid fa-check"></i></div>
    <h1>¡Pago aprobado!</h1>
    <p>Tu plan ha sido activado correctamente. Ya puedes acceder a todos los beneficios de TecniRed.</p>
    <a href="/user_cliente.html" class="btn"><i class="fa-solid fa-rocket"></i> Ir a mi portal</a>
    <div class="payment-id" id="paymentInfo"></div>
  </div>
  <script>
    const params = new URLSearchParams(window.location.search);
    const id = params.get("payment_id");
    const status = params.get("status");
    if (id) document.getElementById("paymentInfo").textContent = "ID de pago: " + id;
  </script>
</body>
</html>
