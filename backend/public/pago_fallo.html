<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Pago fallido | TecniRed</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:"Inter",sans-serif;}
    body{background:#020617;color:#e2e8f0;min-height:100vh;display:grid;place-items:center;}
    .card{background:rgba(15,23,42,0.9);border:1px solid rgba(239,68,68,0.3);border-radius:24px;padding:52px 44px;max-width:480px;width:90%;text-align:center;box-shadow:0 30px 80px rgba(0,0,0,0.5);}
    .icon{width:72px;height:72px;border-radius:50%;background:rgba(239,68,68,0.15);border:2px solid rgba(239,68,68,0.4);display:grid;place-items:center;margin:0 auto 24px;font-size:1.8rem;color:#ef4444;}
    h1{font-size:1.6rem;font-weight:800;margin-bottom:12px;}
    p{color:#94a3b8;line-height:1.7;margin-bottom:28px;}
    .btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;}
    .btn{display:inline-flex;align-items:center;gap:8px;background:linear-gradient(135deg,#0ea5e9,#38bdf8);color:#06202c;padding:13px 28px;border-radius:12px;text-decoration:none;font-weight:700;transition:all 0.3s;}
    .btn:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(56,189,248,0.4);}
    .btn-ghost{background:rgba(255,255,255,0.06);color:#e2e8f0;border:1px solid rgba(255,255,255,0.1);}
    .btn-ghost:hover{border-color:#38bdf8;color:#38bdf8;box-shadow:none;}
  </style>
</head>
<body>
  <div class="card">
    <div class="icon"><i class="fa-solid fa-xmark"></i></div>
    <h1>Pago no completado</h1>
    <p>Hubo un problema al procesar tu pago. Puedes intentarlo de nuevo o contactarnos si el problema persiste.</p>
    <div class="btns">
      <a href="/#planes" class="btn"><i class="fa-solid fa-rotate-left"></i> Intentar de nuevo</a>
      <a href="/#contacto" class="btn btn-ghost"><i class="fa-solid fa-headset"></i> Contactar soporte</a>
    </div>
  </div>
</body>
</html>
