<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard Cliente | TecniRed</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --primary: #4a8df5;
        --secondary: #00c6ff;
        --dark: #0b1629;
        --light: #cbd5e1;
      }

      * {
        box-sizing: border-box;
        font-family: "Poppins", sans-serif;
        transition: all 0.3s ease;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: #0b1629;
        color: var(--light);
        overflow-x: hidden;
      }

      /* ===== PARTICULAS ===== */
      #particles-bg {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: -1;
      }

      header {
        position: sticky;
        top: 0;
        background: rgba(11, 22, 41, 0.9);
        backdrop-filter: blur(12px);
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 15px 5%;
        z-index: 1000;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
      }

      .user {
        display: flex;
        align-items: center;
        gap: 15px;
      }

      .avatar {
        width: 50px;
        height: 50px;
        border-radius: 50%;
        background: linear-gradient(135deg, var(--primary), var(--secondary));
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: bold;
        font-size: 1.3rem;
        color: white;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      }

      .logout {
        background: #ff4d4d;
        border: none;
        color: white;
        padding: 10px 20px;
        border-radius: 8px;
        font-weight: 600;
        cursor: pointer;
      }
      .logout:hover {
        background: #e03b3b;
      }

      .container {
        max-width: 1200px;
        margin: 100px auto 50px auto;
        padding: 20px;
        backdrop-filter: blur(8px);
        background: rgba(11, 22, 41, 0.85);
        border-radius: 20px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        animation: fadeIn 1s ease forwards;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .cards {
        display: flex;
        gap: 20px;
        flex-wrap: wrap;
        margin-bottom: 40px;
      }

      .card {
        flex: 1;
        min-width: 200px;
        padding: 25px;
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(0, 198, 255, 0.25);
        text-align: center;
        cursor: pointer;
        transition: 0.4s;
      }

      .card:hover {
        transform: translateY(-6px);
        box-shadow: 0 15px 40px rgba(0, 198, 255, 0.3);
      }

      .card h3 {
        margin-bottom: 12px;
        font-size: 1.1rem;
      }
      .card span {
        font-size: 2.5rem;
        color: var(--secondary);
        font-weight: 700;
      }

      form {
        max-width: 700px;
        margin: 0 auto 40px auto;
        padding: 30px;
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(0, 198, 255, 0.25);
      }

      input,
      select,
      textarea {
        width: 100%;
        padding: 14px;
        margin-bottom: 18px;
        border-radius: 10px;
        font-size: 1rem;
        border: 1px solid rgba(255, 255, 255, 0.3);
        background: rgba(0, 0, 0, 0.4);
        color: white;
      }

      select option {
        background: #0b1629;
        color: white;
      }

      input:disabled {
        background: rgba(0, 0, 0, 0.5);
        color: var(--light);
      }

      button.submit {
        background: var(--primary);
        color: white;
        font-weight: 600;
        cursor: pointer;
      }
      button.submit:hover {
        background: var(--secondary);
      }

      table {
        width: 100%;
        border-collapse: collapse;
        border-radius: 15px;
        overflow: hidden;
        margin-top: 20px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        background: rgba(255, 255, 255, 0.05);
      }

      th,
      td {
        padding: 14px;
        text-align: center;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      }

      th {
        background: rgba(0, 198, 255, 0.1);
        font-weight: 600;
      }

      tr:hover {
        background: rgba(0, 198, 255, 0.2);
        transform: scale(1.01);
      }

      .status {
        padding: 6px 12px;
        border-radius: 20px;
        font-weight: 600;
        display: inline-block;
        min-width: 75px;
        color: white;
      }
      .nuevo {
        background: #ff9800;
      }
      .proceso {
        background: #2196f3;
      }
      .finalizado {
        background: #4caf50;
      }

      .reveal {
        opacity: 0;
        transform: translateY(40px);
        transition: 1s;
      }
      .reveal.active {
        opacity: 1;
        transform: translateY(0);
      }
    </style>
  </head>
  <body>
    <canvas id="particles-bg"></canvas>

    <header>
      <h2 style="color: var(--secondary)">TecniRed | Portal</h2>
      <div class="user">
        <div class="avatar" id="avatar"></div>
        <span id="bienvenida"></span>
        <button class="logout" onclick="cerrarSesion()">Salir</button>
      </div>
    </header>

    <div class="container">
      <div class="cards reveal">
        <div class="card">
          <h3>Tickets creados</h3>
          <span id="total">0</span>
        </div>
        <div class="card">
          <h3>En proceso</h3>
          <span id="proceso">0</span>
        </div>
        <div class="card">
          <h3>Finalizados</h3>
          <span id="finalizados">0</span>
        </div>
      </div>

      <form onsubmit="crearTicket(event)" class="reveal">
        <input type="text" id="nombre" placeholder="Nombre" disabled />
        <select id="categoria" required>
          <option value="">Selecciona categoría</option>
          <option>Hardware</option>
          <option>Software</option>
          <option>Redes</option>
          <option>Seguridad</option>
        </select>
        <textarea
          id="descripcion"
          placeholder="Describe tu problema"
          required
        ></textarea>
        <button class="submit">Enviar Ticket</button>
      </form>

      <h2 class="reveal">Mis Tickets</h2>
      <table class="reveal">
        <thead>
          <tr>
            <th>ID</th>
            <th>Categoría</th>
            <th>Descripción</th>
            <th>Estado</th>
            <th>Fecha</th>
          </tr>
        </thead>
        <tbody id="tablaTickets"></tbody>
      </table>
    </div>
    <script>
      // ===== PARTICULAS =====
      const canvas = document.getElementById("particles-bg");
      const ctx = canvas.getContext("2d");
      let w = (canvas.width = window.innerWidth);
      let h = (canvas.height = window.innerHeight);

      window.addEventListener("resize", () => {
        w = canvas.width = window.innerWidth;
        h = canvas.height = window.innerHeight;
      });

      const particles = [];
      for (let i = 0; i < 100; i++) {
        particles.push({
          x: Math.random() * w,
          y: Math.random() * h,
          r: Math.random() * 2 + 1,
          dx: (Math.random() - 0.5) * 0.5,
          dy: (Math.random() - 0.5) * 0.5,
        });
      }

      function animateParticles() {
        ctx.clearRect(0, 0, w, h);
        particles.forEach((p) => {
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fillStyle = "rgba(0,198,255,0.3)";
          ctx.fill();
          p.x += p.dx;
          p.y += p.dy;
          if (p.x < 0 || p.x > w) p.dx *= -1;
          if (p.y < 0 || p.y > h) p.dy *= -1;
        });
        requestAnimationFrame(animateParticles);
      }
      animateParticles();

      // ===== USUARIO =====
      const usuario = JSON.parse(localStorage.getItem("usuario"));
      if (!usuario) window.location.href = "/";

      document.getElementById("bienvenida").textContent =
        `Bienvenido, ${usuario.nombre}`;
      document.getElementById("avatar").textContent = usuario.nombre
        .charAt(0)
        .toUpperCase();
      document.getElementById("nombre").value = usuario.nombre;

      // ===== CARGAR TICKETS =====
      async function cargarTickets() {
        try {
          const res = await fetch(`/tickets/usuario/${usuario.email}`);

          if (!res.ok) throw new Error("Error obteniendo tickets");

          const tickets = await res.json();

          console.log("Tickets recibidos:", tickets);

          if (!Array.isArray(tickets)) {
            console.error("La respuesta no es un array");
            return;
          }

          document.getElementById("total").textContent = tickets.length;
          document.getElementById("proceso").textContent = tickets.filter(
            (t) => t.estado === "Proceso",
          ).length;
          document.getElementById("finalizados").textContent = tickets.filter(
            (t) => t.estado === "Finalizado",
          ).length;

          const tbody = document.getElementById("tablaTickets");
          tbody.innerHTML = "";

          tickets.forEach((t, i) => {
            const fila = document.createElement("tr");
            fila.innerHTML = `
          <td>${t.id}</td>
          <td>${t.categoria}</td>
          <td>${t.descripcion}</td>
          <td class="status ${t.estado?.toLowerCase() || ""}">
            ${t.estado || "Nuevo"}
          </td>
          <td>${t.fecha ? new Date(t.fecha).toLocaleString("es-CO") : ""}</td>
        `;
            fila.style.opacity = 0;
            tbody.appendChild(fila);
            setTimeout(() => (fila.style.opacity = 1), 50 * i);
          });
        } catch (err) {
          console.error("Error cargando tickets:", err);
        }
      }

      // ===== CREAR TICKET =====
      async function crearTicket(e) {
        e.preventDefault();

        const data = {
          nombre: usuario.nombre,
          email: usuario.email,
          categoria: document.getElementById("categoria").value,
          descripcion: document.getElementById("descripcion").value,
        };

        if (!data.categoria || !data.descripcion) {
          alert("Completa todos los campos");
          return;
        }

        try {
          const res = await fetch("/tickets", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(data),
          });

          if (!res.ok) throw new Error("Error en servidor");

          const result = await res.json();

          console.log("Respuesta servidor:", result);

          if (result && (result.status === "ok" || result.insertId)) {
            e.target.reset();
            document.getElementById("nombre").value = usuario.nombre;
            await cargarTickets();
          } else {
            alert(result.message || "No se pudo crear el ticket");
          }
        } catch (err) {
          console.error("Error creando ticket:", err);
          alert("Error del servidor");
        }
      }

      // ===== REVEAL ANIMACION =====
      document.addEventListener("DOMContentLoaded", () => {
        cargarTickets();
        const reveals = document.querySelectorAll(".reveal");
        window.addEventListener("scroll", () => {
          for (const r of reveals) {
            const top = r.getBoundingClientRect().top;
            if (top < window.innerHeight - 50) r.classList.add("active");
          }
        });
      });

      // ===== AUTO REFRESH 10 MIN =====
      setInterval(cargarTickets, 600000);

      // ===== LOGOUT =====
      function cerrarSesion() {
        localStorage.removeItem("usuario");
        window.location.href = "/";
      }
    </script>
  </body>
</html>
